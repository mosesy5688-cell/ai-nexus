name: V6.1 Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # L1: Iron Gates - Constitution & Lint
  iron-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: CES Check (Constitution)
        run: npm run ces-check

      # C4 (Commercialization-Constitution): "Sponsors Never Influence
      # Structure". Static gate fails if any payment signal reaches a
      # ranking/scoring/edge serve path. No npm deps -- pure Node, runs early.
      - name: C4 Anti-Arbitration Static Gate
        run: node scripts/check-c4-anti-arbitration.mjs

      # P2 Adoption Telemetry (D-2026-0615-49 O-5, MANDATORY/BLOCKING):
      # no-read + binding-confinement static gate. Fails if the frozen telemetry
      # binding is read by any serve/scoring/ranking/projection/MCP path, if the
      # emitter accepts a Request/URL/Headers param, or if the binding is named
      # outside its textual allowlist. The confinement scan is genuinely repo-wide
      # (derived from git ls-files), so this workflow itself must NOT name the bare
      # binding token. Anti-vacuity + fail-closed self-proof. No npm deps -- pure Node.
      - name: Telemetry No-Read + Binding-Confinement Static Gate
        run: node scripts/check-telemetry-no-read.mjs

  # L2: Unit Logic (Vitest) — this job IS the SRS-1 Tier-1 BLOCKING invariant gate.
  #
  # SRS-1 (the hermetic, deterministic invariant suite — central registry at
  # tests/srs1/INVARIANT_REGISTRY.md) runs here: vitest.config.ts collects
  # **/*.{test,spec}.ts, so both the reused per-fix regressions (tests/unit/*)
  # and the new SRS-1 invariants (tests/srs1/*) execute in this required job.
  # A red SRS-1 assertion fails `unit-test` and blocks the merge. Do NOT narrow
  # the vitest scope to exclude tests/srs1/ — it would silently drop the Tier-1
  # gate. (SRS-2A is Tier-2 / informational / non-blocking, in its own workflow.)
  unit-test:
    runs-on: ubuntu-latest
    needs: iron-gates
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies (Root)
        run: npm ci

      # C2-LOCK (D-2026-0702-228/230 + D-2026-0703-236/237 + D-2026-0704-245): the
      # .mjs node:test suites are NOT collected by vitest (which globs only
      # **/*.{test,spec}.ts). Run them EXPLICITLY as a required gate with the EXACT
      # file list — the satellite-registry contract test, the D-219 core handoff test
      # (the anti-vacuity matrix depends on the CORE test catching a satellite role
      # added to the core closed set), the D-236/D-237 harvest R2 source-authority
      # contract test, the D-245 vfs-pack -> vfs-derived + vfs-derived -> upload R2
      # handoff verifier contract test, the D-262 shards (2/4 -> 3/4) + GAP-5
      # prepared-entity-data R2 handoff verifier contract test AND the D-264
      # cycle-output (3/4 -> 4/4) R2 handoff verifier contract test. No wildcard, no
      # unrelated tests, no continue-on-error: any red fails this job.
      # The vfs-derived suite ALSO covers the AUTHORITY-W warm_read sibling + the
      # publication-family closure gate (VFS_PRODUCER_ARTIFACT_EXACT_CYCLE_AUTHORITY_4_OF_4);
      # the mesh-profile suite covers AUTHORITY-M (mesh-baking -> consumers).
      # The rankings-db suite is ALSO listed here (no wildcard exists): it covers BOTH
      # rankings seams (SEAM_A aggregate-rankings -> finalize, SEAM_B finalize -> 4/4
      # vfs-pack-db), the EXACT-10 complete-set integrity/identity verifier and the
      # FAIL-CLOSED pack-finalizer publication gate that replaced the any-one-file
      # boolean shortcut behind manifest.partitions.rankings_dbs.
      # 2026-07-26 (Factory 1/4 S2 incident): the Factory ALERT notification-matrix
      # suite is appended to the SAME explicit list. It must be listed here or it is
      # not a gate at all -- and an untested alert matrix is how Factory 1/4 failed
      # on a natural cron with nothing notified. It asserts the exact `name:` string
      # of each Factory workflow (read from that workflow's own file) plus the
      # failure / timed_out / cancelled matrix. It sends NO notification.
      # 2026-08-08 (D-2026-0808-410 N3/N5): the step `name:` above had drifted --
      # it still described only the handoff families and never named the
      # r2-restore-progress (T3) or shard-oom (Q8 / GAP-5 / M8.f) families that had
      # already been appended. It is rewritten below to cover the whole list.
      # ONE suite existed on disk but was never registered -- the TA2
      # preview-readiness suite; it is added here. (Base census at f7479217: 20
      # suites on disk vs 19 in this list = exactly one pre-existing gap.) The
      # registration guard is NEW in this PR and self-registers -- it was never an
      # unregistered pre-existing suite. The guard
      # (scripts/ci/test-suite-registration-guard.test.mjs) enumerates every
      # scripts/**/*.test.mjs on disk and diffs it against THIS list, so an
      # unregistered suite -- which is silent by construction, since vitest globs
      # only **/*.{test,spec}.ts and never collects .mjs -- now fails this job. The
      # guard is in its own list on purpose: an unregistered guard is not a gate.
      - name: Run node --test .mjs suites (factory handoff satellite + core + harvest + vfs-derived + shards + cycle-output + mesh-profile + rankings-db + bounded-finalization + runner-capacity; r2-restore-progress T3; shard-oom Q8/GAP-5/M8.f; ci alert-matrix + ta2-preview-readiness + test-suite-registration-guard, blocking)
        run: node --test scripts/factory/aggregate-handoff.test.mjs scripts/factory/satellite-registry-handoff.test.mjs scripts/factory/harvest-authoritative-handoff.test.mjs scripts/factory/vfs-derived-handoff-manifest.test.mjs scripts/factory/shards-handoff-manifest.test.mjs scripts/factory/cycle-output-handoff-manifest.test.mjs scripts/factory/mesh-profile-handoff-manifest.test.mjs scripts/factory/aggregate-bounded-finalization.test.mjs scripts/factory/runner-capacity-preflight.test.mjs scripts/factory/rankings-db-handoff-manifest.test.mjs scripts/ci/alert-notification-matrix.test.mjs scripts/ci/ta2-preview-readiness.test.mjs scripts/ci/test-suite-registration-guard.test.mjs scripts/factory/r2-restore-progress.test.mjs scripts/factory/r2-restore-progress-wiring.test.mjs scripts/factory/shard-oom-repair.test.mjs scripts/factory/shard-oom-ceiling.test.mjs scripts/factory/shard-oom-chunking.test.mjs scripts/factory/shard-oom-q8-invariant.test.mjs scripts/factory/shard-oom-slow.test.mjs scripts/factory/shard-oom-m8f-probe.test.mjs scripts/ingestion/producer-field-bounds.test.mjs scripts/ingestion/producer-line-bound.test.mjs scripts/ingestion/producer-bounds-wiring.test.mjs scripts/ingestion/producer-escalation.test.mjs scripts/factory/registry-renorm-core.test.mjs scripts/factory/registry-renorm-shard.test.mjs scripts/factory/registry-renorm-run.test.mjs scripts/factory/registry-renorm-verification.test.mjs scripts/factory/registry-renorm-census.test.mjs scripts/factory/registry-stale-shard-purge.test.mjs scripts/factory/registry-renorm-wiring.test.mjs scripts/ingestion/producer-compound-failure.test.mjs

      - name: Run Vitest (Root) — Tier-1 SRS-1 invariant suite (blocking)
        run: npx vitest run --coverage

      # D-127 (Founder B3/B5, BLOCKING): the @free2aitools/sdk workspace is NOT
      # collected by the root vitest run (packages/** is excluded so root SRS-1
      # does not double-collect SDK tests). Verify it explicitly INSIDE this same
      # required `unit-test` context — build (tsc), typecheck (tsc --noEmit), and
      # the SDK's own vitest suite. Each command's exit code is honored: any SDK
      # build/typecheck/test failure fails THIS required job. No continue-on-error,
      # no swallowed exits, no separate check name. The SDK live-smoke test is
      # network-gated (skipped unless SDK_LIVE_SMOKE=1) so this stays hermetic.
      - name: Verify @free2aitools/sdk workspace (build + typecheck + test)
        run: |
          npm run build --workspace @free2aitools/sdk
          npm run typecheck --workspace @free2aitools/sdk
          npm test --workspace @free2aitools/sdk
