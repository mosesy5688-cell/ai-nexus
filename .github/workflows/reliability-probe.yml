name: Reliability Probe
# D-2026-0717-345 P1a — external synthetic reliability probe.
# READ-ONLY, black-box. This is NOT a Factory workflow: it makes only public HTTP
# requests to free2aitools.com + the public CDN index header, writes NO R2 object,
# triggers NO Factory pipeline, and collects NO user/adoption data. Evidence is a
# build artifact only (never committed to the repo, never written to R2).
# Rollback = delete this file (no runtime coupling).

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes (UTC)
  workflow_dispatch:
    inputs:
      target:
        description: 'D-403 handoff target to complete: exactly P or F'
        required: true
        type: choice
        options:
          - P
          - F

# Least privilege: the probe reads public endpoints only, so it needs no write
# scopes and no repository contents beyond the checkout.
permissions:
  contents: read

# Do NOT cancel an in-flight probe: a cancelled run would erase evidence and could
# mask a first failure. Overlap is harmless (read-only) and rare at 15-min cadence.
concurrency:
  group: reliability-probe
  cancel-in-progress: false

jobs:
  probe:
    name: External Synthetic Probe
    runs-on: ubuntu-latest
    # D-403 BRANCH-ONLY: raised from 10 so the one-shot evidence collection
    # (hundreds of registry shards hashed + decoded) cannot be truncated. This
    # file is branch-isolated and `schedule` never fires off the default branch,
    # so the scheduled probe's effective cap is unchanged in production.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No auto-retry / no rerun: a single attempt so a first failure is never masked.
      - name: Run reliability probe (read-only)
        id: probe
        if: github.event_name == 'schedule'
        env:
          PROBE_BASE_URL: https://free2aitools.com
          PROBE_INDEX_URL: https://cdn.free2aitools.com/data/id-index.bin
          PROBE_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/monitoring/reliability-probe.mjs probe-evidence.json

      # Persist the structured JSON evidence for >=35 days regardless of verdict.
      - name: Upload probe evidence
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v6
        with:
          name: reliability-probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-evidence.json
          retention-days: 35
          # A crashed probe must still upload its minimal UNKNOWN evidence; a truly
          # MISSING artifact is a hard failure (never a warning that passes green).
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # D-403 STEP 2, BRANCH-ONLY workflow_dispatch path: TARGET-ISOLATED
      # handoff completion. One dispatch completes exactly ONE target (P or F)
      # with its own FRESH 44-minute internal budget inside the 60-minute job.
      #
      # The previous full-POST path is GONE, not merely skipped: there is no
      # C cache restore, no H cache restore, no delta recapture and no
      # invocation of the complete POST collector anywhere in this file.
      #
      # R2 access is LIST + GET only via the shared runtime allow-list. No cache
      # save/delete/reserve, no R2 write, no Factory dispatch, no retry, no
      # rerun, no matrix and no second-target fallthrough. This block exists only
      # on branch audit/d403-registry-readonly-evidence-20260805.
      # ----------------------------------------------------------------------
      - name: Install dependencies (D-403)
        if: github.event_name == 'workflow_dispatch'
        run: npm ci --ignore-scripts

      # The shard decryption secret is bound ONLY on this step. It is never
      # echoed, never interpolated into a shell command, and never written to the
      # report or artifact; the collector validates presence and production
      # format without disclosing any part of it. An invalid `target` is
      # rejected before the R2 client is built and before crypto initialisation.
      - name: Complete D-403 handoff target
        if: github.event_name == 'workflow_dispatch'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AES_CRYPTO_KEY: ${{ secrets.AES_CRYPTO_KEY }}
          D403_BASE_SHA: c81b13f7818a7ad4a19c3b2f94b252a0dd65d41a
          D403_TARGET: ${{ inputs.target }}
          NODE_OPTIONS: --max-old-space-size=5120
        run: node scripts/audit/d403-target-complete.mjs

      # Fail closed: the artifact is worthless without BOTH the report and the
      # package manifest, so a missing file is a hard red, never a warning.
      - name: Verify evidence package completeness
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          test -s d403-target-evidence/report.json
          test -s d403-target-evidence/package-manifest.json

      - name: Upload D-403 target evidence (single artifact)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: d403-target-${{ inputs.target }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: d403-target-evidence/
          retention-days: 35
          if-no-files-found: error
