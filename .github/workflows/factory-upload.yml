            echo "[MESH-PROFILE-HANDOFF] miss/mismatch — recover from exact staging"; NEED_RECOVER=1
          fi
          if [ "$NEED_RECOVER" = "1" ]; then
            rm -rf output/cache/mesh/profile-shards output/cache/mesh/profile-evidence-dict.json.zst; mkdir -p output/cache/mesh
            node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}profile-shards/" output/cache/mesh/profile-shards/ --strict || { echo "::error::AUTH-M: mesh recovery restore failed (${STAGING_PREFIX}profile-shards/). Fail-closed."; exit 1; }
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}profile-evidence-dict.json.zst" output/cache/mesh/profile-evidence-dict.json.zst --strict || { echo "::error::AUTH-M: mesh recovery restore failed (${STAGING_PREFIX}profile-evidence-dict.json.zst). Fail-closed."; exit 1; }
            rm -f output/cache/mesh/manifest.json output/cache/mesh/handoff.json output/cache/mesh/_manifest.json 2>/dev/null || true
            OUT2=$(verify_mesh) || { echo "::error::AUTH-M: exact-staging recovery failed verification (${STAGING_PREFIX}). Fail-closed."; exit 1; }
            [ "$(printf '%s' "$OUT2" | tail -n1)" = "$EXPECT_SET_SHA" ] || { echo "::error::AUTH-M: recovered set hash != producer $EXPECT_SET_SHA. Fail-closed."; exit 1; }
            echo "[MESH-PROFILE-HANDOFF] recovered + verified mesh-profile from exact staging"
          fi
      - name: Migrate Legacy Embedding Cache (one-time)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          SHARD_COUNT=$(find output/cache/embeddings -name 'embed-*.bin.zst' 2>/dev/null | wc -l)
          if [ "$SHARD_COUNT" -eq 0 ]; then
            echo "[MIGRATE] No shards found — attempting legacy SQLite migration..."
            node scripts/factory/r2-workflow-cli.js restore-file state/embedding-cache.db output/cache/embedding-cache.db || true
            node scripts/factory/migrate-embedding-cache.js output/cache/embedding-cache.db output/cache/embeddings
            rm -f output/cache/embedding-cache.db
          else
            echo "[MIGRATE] ${SHARD_COUNT} shards present — no migration needed."
          fi
      - name: Download Hosted-On Data from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          for p in replicate together hf-inference; do
            node scripts/factory/r2-workflow-cli.js restore-file "state/hosted-on/hosted-on-${p}.json" "output/cache/hosted-on-${p}.json" || echo "⚠️ hosted-on-${p}.json not in R2 (first run?)"
          done
      # V27.2: fail-fast before pack-db if essential metadata files are missing.
      # Saves ~2h of wasted runner time on cycle cache miss (run 25896561032).
      - name: Verify Essential Metadata Cache
        run: |
          REQUIRED=(
            "output/cache/mesh/graph.json"
            "output/cache/search-core.json"
            "output/cache/category_stats.json"
          )
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ] && [ ! -f "${f}.zst" ] && [ ! -f "${f}.gz" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Essential metadata cache files missing — pack-db would produce content-stripped meta DBs:"
            printf '  %s\n' "${MISSING[@]}"
            echo "Upstream cycle cache (cycle-<aggregate-run-id>-output) must contain these files."
            exit 1
          fi
          echo "✅ All essential metadata cache files present"
      # V27.52: restore cycle-scoped vfs-pack cache for skip detection.
      # P3-EVIDENCE-1 STAGE-B: the cache key + restore-keys carry VFS_PACK_CODE_VERSION
      # so a restore can NEVER cross packer-code versions. A cache produced by older
      # row-builders code lives under a different prefix and is invisible here; the
      # sentinel gate below is the second, content-level defense.
      - name: Restore VFS Pack Output for Skip Detection (V27.52)
        id: cache-vfs-pack-restore
        if: ${{ !inputs.force_fresh }}
        uses: actions/cache/restore@v5
        with:
          path: |
            output/data/
            output/meta/
            output/cache/reports/
            output/cache/knowledge/
            output/cache/mesh/
          key: intra-4-4-vfs-pack-${{ env.VFS_PACK_CODE_VERSION }}-${{ needs.check-upstream.outputs.upstream-run-id }}-${{ github.run_id }}
          restore-keys: |
            intra-4-4-vfs-pack-${{ env.VFS_PACK_CODE_VERSION }}-${{ needs.check-upstream.outputs.upstream-run-id }}-
      # SEAM_B CONSUMER + PROMOTION (rankings-authority repair, D7/D8). Before this
      # step existed, output/data/rankings-<group>.db reached 4/4 ONLY through the
      # `cycle-<run>-output` GHA cache -- and GHA cache WRITES are 100% denied on this
      # repo, so the packer saw ZERO rankings DBs, pack-finalizer's any-one-file boolean
      # shortcut left manifest.partitions.rankings_dbs UNSET, and POST /api/v1/select
      # returned 503. The 3/4 `rankings-db` R2 authority is now the sole source.
      #
      # Placed AFTER the vfs-pack cache restore (whose restore-keys PREFIX can pull a
      # PREVIOUS attempt's output/data/, including stale/foreign rankings DBs) and BEFORE
      # both the skip-detection and the Packer, and it runs UNCONDITIONALLY -- so the
      # promoted set is authoritative on the fresh-pack path AND on the skip_compute
      # path, and it is in place before the end-of-job vfs-pack handoff manifest
      # (`backup-dir output/data/ --extensions=.db`) captures it for the FIX-4
      # publication binding. Promotion is a verified COPY, never a rename/move (so a
      # re-run is idempotent) and never a rebuild (impossible: exportRankingsDbs needs
      # the fni-sorted accumulator that exists only inside 3/4 rankings-generator).
      - name: Promote Rankings DBs from R2 Authority (SEAM_B, fail-closed)
        id: promote-rankings-dbs
        env:
          HANDOFF_PRODUCER_RUN_ID: ${{ needs.check-upstream.outputs.upstream-run-id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -uo pipefail
          MOD=scripts/factory/rankings-db-handoff-manifest.mjs
          PID="${HANDOFF_PRODUCER_RUN_ID}"
          if [ -z "$PID" ]; then echo "::error::SEAM_B: no upstream-run-id resolved -- cannot consume the rankings-db authority safely. Fail-closed."; exit 1; fi
          # (1) resolve the current-cycle attempt-scoped authority descriptor. Cross-workflow
          # cycle key = the 3/4 Aggregate run id = check-upstream upstream-run-id.
          DESC="state/_handoff/rankings-db/${PID}/handoff.json"
          node scripts/factory/r2-workflow-cli.js restore-file "$DESC" /tmp/rankings-db-handoff-rb.json --strict || { echo "::error::SEAM_B: no current-cycle rankings-db authority descriptor ($DESC). Fail-closed."; exit 1; }
          OUT=$(node "$MOD" verify-descriptor /tmp/rankings-db-handoff-rb.json --carrier=rankings-db) || { echo "::error::SEAM_B: rankings-db descriptor provenance invalid (run/attempt/prefix). Fail-closed."; exit 1; }
          # UNIFIED PARSE IDIOM (see the SEAM_A consumer): LAST stdout line, then cut fields
          # (prefix, set_sha, head_sha, attempt). Single-line stdout is pinned by a test.
          DESC_LINE=$(printf '%s' "$OUT" | tail -n1)
          STAGING_PREFIX=$(printf '%s' "$DESC_LINE" | cut -f1); EXPECT_SET_SHA=$(printf '%s' "$DESC_LINE" | cut -f2)
          EXPECT_HEAD=$(printf '%s' "$DESC_LINE" | cut -f3); EXPECT_ATT=$(printf '%s' "$DESC_LINE" | cut -f4)
          # (2) CROSS-CARRIER FAMILY BIND: rankings-db and cycle-output are written by the
          # SAME 3/4 finalize job execution, so they MUST agree on run id + producer attempt
          # + head_sha. This is how this cross-workflow consumer -- which cannot know the 3/4
          # head sha on its own -- gets an EXACT head-SHA bind for SEAM_B.
          node scripts/factory/r2-workflow-cli.js restore-file "state/_handoff/cycle-output/${PID}/handoff.json" /tmp/rankings-db-sibling.json --strict || { echo "::error::SEAM_B: sibling cycle-output descriptor missing -- cannot family-bind the rankings authority. Fail-closed."; exit 1; }
          node "$MOD" verify-sibling /tmp/rankings-db-handoff-rb.json /tmp/rankings-db-sibling.json || { echo "::error::SEAM_B: rankings-db and cycle-output authorities disagree on run/attempt/head -- refusing a mixed-cycle rankings promotion. Fail-closed."; exit 1; }
          # (3) manifest, then restore the EXACT staging into /tmp (D4: never output/).
          node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}manifest.json" /tmp/rankings-db-manifest.json --strict || { echo "::error::SEAM_B: rankings-db manifest missing at ${STAGING_PREFIX}. Fail-closed."; exit 1; }
          STAGE=/tmp/rankings-stage
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}" "${STAGE}/" --strict || { echo "::error::SEAM_B: restore failed (${STAGING_PREFIX}). Fail-closed."; exit 1; }
          rm -f "$STAGE/manifest.json" "$STAGE/handoff.json" "$STAGE/_manifest.json" 2>/dev/null || true
          OUT2=$(node "$MOD" verify "$STAGE" /tmp/rankings-db-manifest.json --carrier=rankings-db) || { echo "::error::SEAM_B: staged rankings set failed manifest verification. Fail-closed."; exit 1; }
          [ "$(printf '%s' "$OUT2" | tail -n1)" = "$EXPECT_SET_SHA" ] || { echo "::error::SEAM_B: staged set hash != producer $EXPECT_SET_SHA. Fail-closed."; exit 1; }
          # (4) FULL check set on the STAGED copies (D7): EXACT 10-name set, size+sha256 vs
          # the manifest, SQLite magic, PRAGMA quick_check, producer-derived schema,
          # provenance keys, and ONE identical run/attempt/head equal to the descriptor's.
          # RANKINGS_REQUIRE_IDENTITY=1: an EMPTY expectation must be a LOUD failure
          # (IDENTITY_BINDING_REQUIRED_BUT_EMPTY), never a silently skipped identity check.
          export RANKINGS_REQUIRE_IDENTITY=1
          export RANKINGS_DB_MANIFEST=/tmp/rankings-db-manifest.json
          export RANKINGS_MEMBER_PREFIX=data/
          export RANKINGS_EXPECT_RUN_ID="${PID}"
          export RANKINGS_EXPECT_HEAD_SHA="${EXPECT_HEAD}"
          export RANKINGS_MAX_ATTEMPT="${EXPECT_ATT}"
          node "$MOD" verify-dbs "$STAGE/data" || { echo "::error::SEAM_B: staged rankings DBs failed the integrity/identity check set. Fail-closed."; exit 1; }
          # (5) promote = verified COPY, wiping any stale/extra rankings DB the GHA
          # restore-keys prefix may have carried in from a previous attempt.
          mkdir -p output/data
          rm -f output/data/rankings-*.db
          cp "$STAGE"/data/rankings-*.db output/data/ || { echo "::error::SEAM_B: promotion copy into output/data failed. Fail-closed."; exit 1; }
          # (6) RE-VERIFY at the DESTINATION (D8) -- the copy itself is not trusted.
          node "$MOD" verify-dbs output/data || { echo "::error::SEAM_B: promoted output/data rankings set failed post-promotion verification. Fail-closed."; exit 1; }
          echo "expect_run_id=${PID}" >> "$GITHUB_OUTPUT"
          echo "expect_head_sha=${EXPECT_HEAD}" >> "$GITHUB_OUTPUT"
          echo "max_attempt=${EXPECT_ATT}" >> "$GITHUB_OUTPUT"
          echo "set_sha=${EXPECT_SET_SHA}" >> "$GITHUB_OUTPUT"
          echo "[RANKINGS-DB-HANDOFF] promoted + re-verified 10/10 rankings DBs into output/data (set_sha=${EXPECT_SET_SHA})"
      # P3-EVIDENCE-1 STAGE-B: skip pack-db ONLY when ALL hold —
      #   (a) force_fresh is NOT set,
      #   (b) >= 20 meta-NN.db present,
      #   (c) the mesh graph is present,
      #   (d) the version sentinel EXACTLY equals VFS_PACK_CODE_VERSION.
      # A missing OR mismatched sentinel -> skip_compute=false (must run pack-db.js),
      # so repaired row-builders code can never be skipped on a re-run of a stale cache.
      # force_fresh -> unconditional fresh compute (and the fresh pack below overwrites
      # any restored meta-NN.db). The sentinel file is written by the fresh-pack step.
      - name: Detect vfs-pack output present
        id: detect-vfs-pack
        env:
          VFS_PACK_CODE_VERSION: ${{ env.VFS_PACK_CODE_VERSION }}
          FORCE_FRESH: ${{ inputs.force_fresh }}
        run: |
          SENTINEL=output/meta/vfs-pack-code-version.txt
          META_COUNT=$(find output/data -name 'meta-*.db' 2>/dev/null | wc -l)
          MESH_OK=false
          { [ -f output/cache/mesh/graph.json ] || [ -f output/cache/mesh/graph.json.zst ]; } && MESH_OK=true
          SENTINEL_VAL=""
          [ -f "$SENTINEL" ] && SENTINEL_VAL=$(tr -d '[:space:]' < "$SENTINEL")
          if [ "$FORCE_FRESH" = "true" ]; then
            echo "skip_compute=false" >> "$GITHUB_OUTPUT"
            echo "[STAGE-B] force_fresh=true → unconditional fresh pack-db (cache ignored)"
          elif [ "$META_COUNT" -ge 20 ] && [ "$MESH_OK" = "true" ] && [ "$SENTINEL_VAL" = "$VFS_PACK_CODE_VERSION" ]; then
            echo "skip_compute=true" >> "$GITHUB_OUTPUT"
            echo "[STAGE-B] ${META_COUNT} meta-NN.db + mesh graph + sentinel '${SENTINEL_VAL}' == '${VFS_PACK_CODE_VERSION}' → skip pack-db.js compute"
          else
            echo "skip_compute=false" >> "$GITHUB_OUTPUT"
            echo "[STAGE-B] fresh pack-db: meta=${META_COUNT}(need>=20) mesh=${MESH_OK} sentinel='${SENTINEL_VAL}'(need '${VFS_PACK_CODE_VERSION}')"
          fi
      # D-297 (PR-B): FAIL-CLOSED capacity preflight BEFORE the Packer. Mirrors the SAME
      # skip guard so it runs only when pack-db will actually compute. pack-db.js opens
      # META_SHARD_COUNT=96 meta-NN.db simultaneously (per-DB SQLite page-cache + WAL/journal
      # transient ×96 + denormalized meta rows) while the fused set stays resident. MEASURES
      # df free + du of output/cache/{fused,embeddings,reports,knowledge,mesh}, fails closed
      # INSUFFICIENT_RUNNER_DISK_UPLOAD_PACKER (+ coarse memory guard) BEFORE the compute.
      # No warning-only, no `|| true`.
      - name: Capacity Preflight — Packer (fail-closed)
        if: steps.detect-vfs-pack.outputs.skip_compute != 'true'
        env:
          CAPACITY_OLD_SPACE_MB: '6144'  # mirror the Packer step's --max-old-space-size for the coarse memory guard
        run: node scripts/factory/lib/runner-capacity-preflight.mjs UPLOAD_PACKER
      - name: Execute Stable 1.0 Packer
        if: steps.detect-vfs-pack.outputs.skip_compute != 'true'
        env:
          CACHE_DIR: ./output/cache
          AES_CRYPTO_KEY: ${{ secrets.AES_CRYPTO_KEY }}
          NODE_OPTIONS: '--max-old-space-size=6144 --expose-gc'
          VFS_PACK_CODE_VERSION: ${{ env.VFS_PACK_CODE_VERSION }}
          # D9a: bind pack-finalizer's fail-closed rankings gate to the SAME
          # current-cycle authority the promotion step above already verified.
          # REQUIRE_IDENTITY=1 => an empty expectation THROWS instead of degrading
          # the gate to structure-only with no signal.
          RANKINGS_REQUIRE_IDENTITY: '1'
          RANKINGS_DB_MANIFEST: /tmp/rankings-db-manifest.json
          RANKINGS_MEMBER_PREFIX: data/
          RANKINGS_EXPECT_RUN_ID: ${{ steps.promote-rankings-dbs.outputs.expect_run_id }}
          RANKINGS_EXPECT_HEAD_SHA: ${{ steps.promote-rankings-dbs.outputs.expect_head_sha }}
          RANKINGS_MAX_ATTEMPT: ${{ steps.promote-rankings-dbs.outputs.max_attempt }}
        # P3-EVIDENCE-1 STAGE-B: a SUCCESSFUL fresh pack stamps the version sentinel
        # (output/meta/, carried by the vfs-pack save below). It is written only after
        # pack-db.js exits 0, so a failed/partial pack leaves no/old sentinel and the
        # next run will NOT skip. force_fresh reaches here too (skip_compute=false),
        # and this fresh pack overwrites any restored meta-NN.db.
        run: |
          node scripts/factory/pack-db.js
          mkdir -p output/meta
          printf '%s' "$VFS_PACK_CODE_VERSION" > output/meta/vfs-pack-code-version.txt
          echo "[STAGE-B] wrote pack-code sentinel: $(cat output/meta/vfs-pack-code-version.txt)"
      # C4 Stage-2 (Founder D-2026-0714-333): POST-pack FAIL-CLOSED gate. Assert NO proven
      # cross-type phantom survived into the packed meta-NN.db set AND the count contract
      # holds (removed == removal-ledger members; valid_id_changed=0; valid_umid_changed=0;
      # stale_record_removed=0). Any residual/drift => ZERO_PUBLICATION (fail before publish).
      # C4 Stage-2 (D-337 Blocker 5): a census-requested run must NEVER reuse the pack cache
      # (that would SKIP the POST-pack residual/drift/count gate) => fail closed. Unskippable on census.
      - name: C4 Stage-2 Census Cannot Skip POST-pack (fail-closed)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
          GITHUB_SHA: ${{ github.sha }}
          UP: ${{ needs.check-upstream.outputs.upstream-run-id }}
          SKIP_COMPUTE: ${{ steps.detect-vfs-pack.outputs.skip_compute }}
        run: |
          mkdir -p output/cache/c4-stage2
          # D-338 Blocker 1: the cascade tuple MUST resolve. A missing/unreadable tuple is a BROKEN cascade =>
          # ZERO_PUBLICATION - the OLD `if ! restore ... exit 0` was a reachable fail-open that skipped the
          # POST-pack residual/drift/count gate when skip_compute=true (D-337 Bl5 hole).
          node scripts/factory/r2-workflow-cli.js restore-file "state/_handoff/c4-stage2/${UP}/tuple.json" output/cache/c4-stage2/tuple.json --strict || { echo "::error::[C4-S2] cascade tuple absent/unreadable => ZERO_PUBLICATION"; exit 1; }
          # A foreign/malformed tuple must ALSO fail the step (command substitution does NOT abort by default).
          MREF=$(node --input-type=module -e "import {resolveCascadeTuple,cascadeTupleKey} from './scripts/factory/lib/c4s2-candidate-universe.js';import fs from 'fs';const up=process.env.UP,h=process.env.GITHUB_SHA;const s={[cascadeTupleKey(up)]:JSON.parse(fs.readFileSync('output/cache/c4-stage2/tuple.json','utf8'))};const r=resolveCascadeTuple({store:s,upstreamRunId:up,headSha:h});if(!r.ok){console.error('[C4-S2] '+(r.terminal||r.reason)+' => ZERO_PUBLICATION');process.exit(1)}process.stdout.write(r.manifestKey)") || { echo "::error::[C4-S2] cascade tuple foreign/unreadable => ZERO_PUBLICATION"; exit 1; }
          [ -n "$MREF" ] || { echo "::error::[C4-S2] empty manifest key => ZERO_PUBLICATION"; exit 1; }
          node scripts/factory/r2-workflow-cli.js restore-file "state/c4-stage2/${MREF}/exclusion-manifest.json" output/cache/c4-stage2/exclusion-manifest.json --strict
          # Dormant-vs-census decided by the PURE censusSkipGuardVerdict; census + pack-cache reuse => POST-pack gate skipped => fail-closed.
          node --input-type=module -e "import {resolveCascadeTuple,cascadeTupleKey,censusSkipGuardVerdict} from './scripts/factory/lib/c4s2-candidate-universe.js';import fs from 'fs';const up=process.env.UP,h=process.env.GITHUB_SHA;const s={[cascadeTupleKey(up)]:JSON.parse(fs.readFileSync('output/cache/c4-stage2/tuple.json','utf8'))};const resolve=resolveCascadeTuple({store:s,upstreamRunId:up,headSha:h});const manifest=JSON.parse(fs.readFileSync('output/cache/c4-stage2/exclusion-manifest.json','utf8'));const v=censusSkipGuardVerdict({resolve,manifest,skipCompute:process.env.SKIP_COMPUTE==='true'});if(v.terminal){console.error('::error::[C4-S2] census-requested run would REUSE the pack cache (POST-pack gate skipped) OR dormant manifest invalid => '+v.terminal+(v.reason?' ('+v.reason+')':'')+' ZERO_PUBLICATION. Re-run fresh (force_fresh).');process.exit(1)}console.log('[C4-S2] census POST-pack-skip guard OK (skip_compute='+process.env.SKIP_COMPUTE+' dormant='+v.dormant+')')" || { echo "::error::[C4-S2] census POST-pack-skip guard fatal => ZERO_PUBLICATION"; exit 1; }
      - name: C4 Stage-2 POST-pack Gate (fail-closed)
        if: steps.detect-vfs-pack.outputs.skip_compute != 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
          GITHUB_SHA: ${{ github.sha }}
          UP: ${{ needs.check-upstream.outputs.upstream-run-id }}
        run: |
          mkdir -p output/cache/c4-stage2
          # D-337 Blocker 4: cascade-bound tuple keyed by THIS cascade's upstream (un-overwritable) -> IMMUTABLE manifest key.
          node scripts/factory/r2-workflow-cli.js restore-file "state/_handoff/c4-stage2/${UP}/tuple.json" output/cache/c4-stage2/tuple.json --strict
          # D-338: harden the command substitution - foreign/malformed tuple or empty key => fail-closed (defense-in-depth).
          MREF=$(node --input-type=module -e "import {resolveCascadeTuple,cascadeTupleKey} from './scripts/factory/lib/c4s2-candidate-universe.js';import fs from 'fs';const up=process.env.UP,h=process.env.GITHUB_SHA;const s={[cascadeTupleKey(up)]:JSON.parse(fs.readFileSync('output/cache/c4-stage2/tuple.json','utf8'))};const r=resolveCascadeTuple({store:s,upstreamRunId:up,headSha:h});if(!r.ok){console.error('[C4-S2] '+(r.terminal||r.reason)+' => ZERO_PUBLICATION');process.exit(1)}process.stdout.write(r.manifestKey)") || { echo "::error::[C4-S2] cascade tuple foreign/unreadable => ZERO_PUBLICATION"; exit 1; }
          [ -n "$MREF" ] || { echo "::error::[C4-S2] empty manifest key => ZERO_PUBLICATION"; exit 1; }
          node scripts/factory/r2-workflow-cli.js restore-file "state/c4-stage2/${MREF}/exclusion-manifest.json" output/cache/c4-stage2/exclusion-manifest.json --strict
          node scripts/factory/lib/hf-phantom-reconciler.js verify-post output/cache/c4-stage2/exclusion-manifest.json output/data
      # V27.2 fail-loud gate (always runs as sanity check on both fresh + cached data)
      - name: V27.2 Verify Shard-Meta Consistency
        run: node scripts/factory/verify-shard-meta-consistency.js
      # PR-C2 WIRE: run the identity-cluster crate on the 4/4 full recompute.
      # Reads ONLY PR-C1 SAME_AS shards (output/cache/assertions/, restored via the
      # cycle-output cache above) and writes ONLY the cluster-assignment artifact
      # (output/cache/identity/, producer-internal -- NOT in the upload allow-list).
      # HARD-fails the bake if buildIdentityClusters errors (MAX_PASSES / SKEW /
      # NON_SINGLETON_FLOOR); skips loudly only when PR-C1 produced no shards.
      - name: PR-C2 Build Identity Clusters
        env:
          OUTPUT_DIR: ./output
          CACHE_DIR: ./output/cache
        run: node scripts/factory/build-identity-clusters.js
      # Persist the cluster artifact to R2 producer-internal state (NOT the public
      # CDN). Gated on a fresh compute so a re-dispatch cache-hit does not re-upload.
      - name: Backup Identity Clusters to R2
        if: success() && steps.detect-vfs-pack.outputs.skip_compute != 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          if [ -f output/cache/identity/cluster-assignment.jsonl.zst ]; then
            node scripts/factory/r2-workflow-cli.js backup-dir output/cache/identity/ state/identity/
            echo "[R2] Identity cluster-assignment backed up to state/identity/"
          else
            echo "[IDENTITY] No cluster artifact to back up (PR-C1 produced no SAME_AS shards this cycle)."
          fi
      - name: Save Embedding Shards to Cache
        if: success() && steps.detect-vfs-pack.outputs.skip_compute != 'true'
        uses: actions/cache/save@v5
        with:
          path: output/cache/embeddings/
          key: embedding-shards-${{ env.EMBED_CODE_VERSION }}-${{ needs.check-upstream.outputs.upstream-run-id }}-${{ github.run_id }}
      - name: Backup Embedding Shards to R2
        if: success() && steps.detect-vfs-pack.outputs.skip_compute != 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          node scripts/factory/r2-workflow-cli.js backup-dir output/cache/embeddings/ state/embeddings/ --extensions=.bin.zst
          if [ -f "output/cache/pack-state.db" ]; then
            node -e "const D=require('better-sqlite3')('./output/cache/pack-state.db');D.exec('DROP TABLE IF EXISTS html_cache');D.exec('VACUUM');D.close();"
            node scripts/factory/r2-workflow-cli.js upload-file output/cache/pack-state.db state/pack-state.db
          fi
          echo "[R2] Embedding shards + pack-state (no html_cache) backed up"

      # V27.51: backup meta-NN.db + sitemaps to R2 — vfs-pack → vfs-derived → upload cache
      # chain hit GHA 10GB cache-entry limit on the V27.40 first real cron (run
      # 26362048142, vfs-assets save silently failed because vfs-pack restore had
      # already used 12.8GB). upload's cache restore returned empty → output/data/
      # had no meta-NN.db → L2 probe failed → cycle broke after 4h+ compute.
      # R2 is source-of-truth (P2 principle); backing up meta DBs here decouples
      # upload-job correctness from inter-job cache success.
      # V27.51 + V27.52: backup meta-NN.db + sitemaps to R2. Gated on detect-vfs-pack
      # so re-dispatch cache-hit doesn't re-upload identical state (R2 has it).
      - name: Backup VFS Data to R2 (V27.51)
        if: success() && steps.detect-vfs-pack.outputs.skip_compute != 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          # R5-BACKUP-FENCE (Founder D-352 F-1 repair) -- FAIL-CLOSED, runs BEFORE any
          # state/vfs-data PUT in this step. The command below is a BROAD directory
          # backup of output/data/ into the PERMANENT state/vfs-data/ prefix, so any R5
          # staging class appearing under output/data/ would accumulate there forever.
          # Presence of these paths is therefore forbidden OUTRIGHT: an EMPTY directory
          # fails, and a SYMLINK at the path fails. Detection prints ::error:: and exits
          # non-zero, so backup-dir never runs. This guard does NOT rely on the legacy
          # uploader's exclusions, on extension filters, on a warning, on an
          # empty-directory assumption, on a future DELETE/GC, or on STAGE_MODE.
          for forbidden in output/data/blobs output/data/cycles output/data/quarantine; do
            if [ -e "$forbidden" ] || [ -L "$forbidden" ]; then
              echo "::error::[R5-BACKUP-FENCE] forbidden path present: $forbidden"
              exit 1
            fi
          done
          node scripts/factory/r2-workflow-cli.js backup-dir output/data/ state/vfs-data/
          if [ -d "output/meta" ]; then
            node scripts/factory/r2-workflow-cli.js backup-dir output/meta/ state/vfs-meta/ || true
          fi
          META_COUNT=$(find output/data -name 'meta-*.db' 2>/dev/null | wc -l)
          echo "[R2] VFS data backed up: ${META_COUNT} meta-NN.db files to state/vfs-data/"
      # D-245 PRIMARY EXACT-PRODUCER R2 HANDOFF — establish a DURABLE, run +
      # PRODUCER-attempt scoped, content-verified vfs-pack authority so VFS Derived
      # never depends on the LRU-evicted / write-denied GHA vfs-pack cache (the root
      # cause: the cache carrying output/data/ meta-NN.db was unretrievable, so the
      # empty-state guard fail-closed and the whole publish chain was skipped). Runs
      # AFTER the pack + sentinel + shard-meta gates, so output/data/ is verified.
      # PRODUCER attempt = github.run_attempt OF THIS job. Order: (1) local manifest over
      # the meta-NN.db set -> (2) data (.db) to the attempt-scoped staging prefix (manifest
      # LAST) -> (3) handoff.json descriptor LAST OF ALL -> (4) read-back verify ->
      # (5) export the verified identity. Fail-loud on any step. Gated on success() (NOT
      # skip_compute) so a re-dispatch cache-hit STILL establishes a current-run authority.
      # The manifest/descriptor go to R2 + /tmp only, NEVER into output/data/ (the tree
      # r2-upload-s3.js publishes to the public CDN).
      - name: Produce Exact-Producer R2 Handoff (VFS-PACK, D-245)
        id: vfs-pack-handoff
        if: success()
        env:
          HANDOFF_UPSTREAM_RUN_ID: ${{ needs.check-upstream.outputs.upstream-run-id }}
          HANDOFF_FACTORY_RUN_ID: ${{ github.run_id }}
          HANDOFF_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          HANDOFF_HEAD_SHA: ${{ github.sha }}
          HANDOFF_VFS_PACK_CODE_VERSION: ${{ env.VFS_PACK_CODE_VERSION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -euo pipefail
          UP="${HANDOFF_UPSTREAM_RUN_ID}"; RUN="${HANDOFF_FACTORY_RUN_ID}"; ATT="${HANDOFF_PRODUCER_ATTEMPT}"
          RUN_PREFIX="state/_handoff/vfs-pack/${UP}/${RUN}"
          export STAGING="${RUN_PREFIX}/attempt-${ATT}/"
          # (1) local manifest over output/data/ meta-NN.db set (.db only) + the D-246 RSS
          # input presence/sha probe (--rss-base=. => output/cache/{reports,knowledge}/…).
          # Written to /tmp so it never pollutes the publicly-uploaded output/data/ tree.
          node scripts/factory/vfs-derived-handoff-manifest.mjs generate output/data/ /tmp/vfs-pack-manifest.json --carrier=vfs-pack-authority --ext=.db --rss-base=.
          export SET_SHA=$(node -e "process.stdout.write(require('/tmp/vfs-pack-manifest.json').set_sha256)")
          export MANIFEST_SHA=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync('/tmp/vfs-pack-manifest.json')).digest('hex'))")
          # (2) upload ALL .db meta data FIRST, to the meta ROLE sub-prefix ${STAGING}meta/.
          # D-302: each backup-dir role gets its OWN sub-prefix so it writes its OWN
          # _manifest.json restore sidecar — the .bin warm backup (2w) can NEVER overwrite
          # the meta restore index (the D-245 last-writer-wins bug that dropped every meta-NN.db
          # incl. meta-00.db from the surviving restore index and fail-closed VFS Derived). The
          # meta CONTENT manifest.json + its set_sha256 (2c) are UNCHANGED — sub-prefixing changes
          # only WHERE the .db live in R2, not their output/data-relative names, content, or hash.
          node scripts/factory/r2-workflow-cli.js backup-dir output/data/ "${STAGING}meta/" --extensions=.db
          # (2b) D-246: stage the DECLARED-PRESENT RSS-generator inputs (CAPTURED_IF_PRESENT)
          # under rss-inputs/… so VFS Derived recovers them BEFORE rss-generator. Absent
          # (paused/floor-zero) inputs are recorded present:false and NOT in the plan.
          node scripts/factory/vfs-derived-handoff-manifest.mjs rss-recovery-plan /tmp/vfs-pack-manifest.json --carrier=vfs-pack-authority > /tmp/vfs-pack-rss-plan.tsv
          while IFS=$'\t' read -r RSS_STAGED RSS_LOCAL RSS_SHA; do
            [ -z "$RSS_STAGED" ] && continue
            node scripts/factory/r2-workflow-cli.js upload-file "$RSS_LOCAL" "${STAGING}${RSS_STAGED}"
          done < /tmp/vfs-pack-rss-plan.tsv
          # (2w) AUTHORITY-W: SIBLING warm-read authority. The meta_db manifest.json + its
          # set_sha256 (2c below) stay BYTE-IDENTICAL — warm_read is a SEPARATE manifest over
          # the shared warm-tier producer artifacts (vector-core.bin/hot-shard.bin/id-index.bin
          # + term_index/**), staged into the SAME attempt prefix. Order: generate warm sibling
          # manifest -> stage the warm data (bins + term_index) into STAGING -> upload the
          # warm-read-manifest.json (manifest-last for warm too) BEFORE the meta manifest/desc.
          # This makes wiping+restoring STAGING recover the FULL output/data/ (meta .db + warm),
          # killing the self-strip. NEVER writes the warm manifest into the public output/data/.
          node scripts/factory/vfs-derived-handoff-manifest.mjs generate-warm-read output/data/ /tmp/vfs-warm-read-manifest.json --carrier=vfs-pack-authority
          export WARM_SET_SHA=$(node -e "process.stdout.write(require('/tmp/vfs-warm-read-manifest.json').set_sha256)")
          export WARM_MEMBER_COUNT=$(node -e "process.stdout.write(String(require('/tmp/vfs-warm-read-manifest.json').member_count))")
          # bins (the 3 named + any stray .bin, harmless — the warm INCLUDE verify ignores non-members).
          # D-302: warm ROLE sub-prefix ${STAGING}warm/ — its OWN _manifest.json restore sidecar,
          # never colliding with the meta (2) or term_index (below) restore indices. term_index
          # already had a distinct sub-prefix (below) — the meta vs warm collision was the only bug.
          node scripts/factory/r2-workflow-cli.js backup-dir output/data/ "${STAGING}warm/" --extensions=.bin
          # term_index/** subtree (the _manifest.json.zst + per-prefix buckets + high-freq chunks)
          [ -d output/data/term_index ] && node scripts/factory/r2-workflow-cli.js backup-dir output/data/term_index/ "${STAGING}term_index/"
          # warm-read-manifest.json (SIBLING of manifest.json) — after all warm data is durable.
          node scripts/factory/r2-workflow-cli.js upload-file /tmp/vfs-warm-read-manifest.json "${STAGING}warm-read-manifest.json"
          # (2p) RANKINGS-PUBLICATION-SIBLING (D-395) ADDITIVE member: carry output/data/shards_manifest.json.
          # pack-finalizer is its ONLY writer, so on the skip-compute path (old pack cache
          # hit) and on the FIX-4 recovery path (rm -rf output/data/ + restore of .db/warm
          # .bin/term_index ONLY) it is ABSENT -- and the D9b pre-publish gate requires it.
          # NOT mixed into the meta set_sha256 (that hash + the warm_read sibling stay
          # BYTE-IDENTICAL); it is bound by its OWN descriptor sha+size fields below.
          # Validation is SEMANTIC before anything is claimed: exists -> non-empty -> parses
          # -> partitions.rankings_dbs === true -> hash+size. Data uploaded FIRST (here),
          # descriptor LAST (3), read-back re-verified (4p), announced only after that.
          SM_OUT=$(node scripts/factory/rankings-db-handoff-manifest.mjs shards-manifest-emit output/data/shards_manifest.json) || { echo "::error::RANKINGS-PUBLICATION-SIBLING: output/data/shards_manifest.json missing/unparseable or partitions.rankings_dbs !== true -- refusing to establish a publication authority. Fail-closed."; exit 1; }
          SM_LINE=$(printf '%s' "$SM_OUT" | tail -n1)
          export SM_SHA=$(printf '%s' "$SM_LINE" | cut -f1); export SM_SIZE=$(printf '%s' "$SM_LINE" | cut -f2)
          # The LOCAL identity is what seeds the descriptor AND what is later handed to
          # shards-manifest-fields as --expect-sha/--expect-size. The module treats an EMPTY
          # expectation as "no expectation" (a legacy-permissive branch kept for off-workflow
          # callers), so an empty value here would SILENTLY SKIP the divergence check and
          # re-open the decorative-binding defect. Close it at the call site, fail-closed.
          if [ -z "${SM_SHA}" ] || [ -z "${SM_SIZE}" ]; then echo "::error::RANKINGS-PUBLICATION-SIBLING: locally computed shards_manifest identity is EMPTY (SM_SHA='${SM_SHA}' SM_SIZE='${SM_SIZE}') -- the local identity used as the descriptor expectation must never be empty, otherwise the divergence check would silently skip. Fail-closed."; exit 1; fi
          node scripts/factory/r2-workflow-cli.js upload-file output/data/shards_manifest.json "${STAGING}publication/shards_manifest.json"
          # (2c) manifest.json LAST (after every data object incl. present RSS inputs is durable).
          node scripts/factory/r2-workflow-cli.js upload-file /tmp/vfs-pack-manifest.json "${STAGING}manifest.json"
          # (3) run-scoped descriptor handoff.json LAST OF ALL. Binds ONLY current upstream
          # + current factory run + this producer attempt + head-SHA + VFS_PACK_CODE_VERSION,
          # and RECORDS per-RSS-input presence (D-246 §2) so paused/absent is distinguishable.
          # AUTHORITY-W: the descriptor gains ONLY additive warm_read_set_sha256 +
          # warm_read_member_count — the meta set_sha256/manifest_sha256 are UNCHANGED.
          node -e "const f=require('fs');const m=require('/tmp/vfs-pack-manifest.json');f.writeFileSync('/tmp/vfs-pack-handoff.json',JSON.stringify({schema_version:1,carrier_type:'vfs-pack-authority',producer_attempt:Number(process.env.HANDOFF_PRODUCER_ATTEMPT),exact_staging_prefix:process.env.STAGING,manifest_sha256:process.env.MANIFEST_SHA,set_sha256:process.env.SET_SHA,warm_read_set_sha256:String(process.env.WARM_SET_SHA),warm_read_member_count:Number(process.env.WARM_MEMBER_COUNT),shards_manifest_sha256:String(process.env.SM_SHA),shards_manifest_size:Number(process.env.SM_SIZE),upstream_run_id:String(process.env.HANDOFF_UPSTREAM_RUN_ID),factory_run_id:String(process.env.HANDOFF_FACTORY_RUN_ID),head_sha:String(process.env.HANDOFF_HEAD_SHA),vfs_pack_code_version:String(process.env.HANDOFF_VFS_PACK_CODE_VERSION),parent_set_sha256:null,rss_inputs:(m.rss_inputs||[]).map(e=>({name:e.name,present:e.present})),created_at:new Date().toISOString()}))"
          node scripts/factory/r2-workflow-cli.js upload-file /tmp/vfs-pack-handoff.json "${RUN_PREFIX}/handoff.json"
          # (4) read-back verify the descriptor provenance (missing/malformed => fail-loud).
          node scripts/factory/r2-workflow-cli.js restore-file "${RUN_PREFIX}/handoff.json" /tmp/vfs-pack-handoff-rb.json --strict
          OUT=$(HANDOFF_RUN_ATTEMPT="${ATT}" node scripts/factory/vfs-derived-handoff-manifest.mjs verify-descriptor /tmp/vfs-pack-handoff-rb.json --carrier=vfs-pack-authority)
          V_PREFIX=$(printf '%s' "$OUT" | cut -f1); V_SET=$(printf '%s' "$OUT" | cut -f2)
          # (4w) AUTHORITY-W read-back: restore the durable warm-read-manifest.json + assert its
          # set_sha equals the locally-generated warm authority (a partial/corrupt warm upload reds).
          node scripts/factory/r2-workflow-cli.js restore-file "${STAGING}warm-read-manifest.json" /tmp/vfs-warm-read-manifest-rb.json --strict
          RB_WARM_SET=$(node -e "process.stdout.write(require('/tmp/vfs-warm-read-manifest-rb.json').set_sha256)")
          [ "$RB_WARM_SET" = "$WARM_SET_SHA" ] || { echo "::error::AUTH-W: warm-read-manifest read-back set_sha mismatch. Fail-closed."; exit 1; }
          # (4p) RANKINGS-PUBLICATION-SIBLING read-back: the descriptor must actually CARRY the two new
          # fields, and the durable object must re-verify byte-for-byte AND semantically
          # (parses + partitions.rankings_dbs === true) against them, so a partial or
          # corrupt sibling upload can never be announced as an authority.
          # The ENFORCED identity must ORIGINATE in the durable descriptor read-back, never in
          # producer-local shell variables. Presence+syntax alone left the binding DECORATIVE: a
          # different-but-well-formed SHA and a different-but-positive size passed, because the
          # sibling was then checked against the LOCAL values and those locals were exported as
          # the job outputs. So: parse RB_SM_SHA/RB_SM_SIZE OUT of /tmp/vfs-pack-handoff-rb.json,
          # require EXACT agreement with the local SM_SHA/SM_SIZE (distinct *_DIVERGED codes =
          # "the descriptor lied or the upload raced"), then use ONLY the read-back values for the
          # durable sibling verification, the job outputs and both FIX-4 consumers.
          RB_FIELDS=$(node scripts/factory/rankings-db-handoff-manifest.mjs shards-manifest-fields /tmp/vfs-pack-handoff-rb.json --expect-sha="${SM_SHA}" --expect-size="${SM_SIZE}") || { echo "::error::RANKINGS-PUBLICATION-SIBLING: descriptor shards_manifest identity missing/malformed, or DIVERGED from the locally computed hash/size. Fail-closed."; exit 1; }
          RB_FIELDS_LINE=$(printf '%s' "$RB_FIELDS" | tail -n1)
          RB_SM_SHA=$(printf '%s' "$RB_FIELDS_LINE" | cut -f1); RB_SM_SIZE=$(printf '%s' "$RB_FIELDS_LINE" | cut -f2)
          # An EMPTY parsed value is a HARD error, never "no expectation".
          if [ -z "${RB_SM_SHA}" ] || [ -z "${RB_SM_SIZE}" ]; then echo "::error::RANKINGS-PUBLICATION-SIBLING: empty shards_manifest identity parsed from the read-back descriptor. Fail-closed."; exit 1; fi
          node scripts/factory/r2-workflow-cli.js restore-file "${STAGING}publication/shards_manifest.json" /tmp/vfs-pack-shards-manifest-rb.json --strict || { echo "::error::RANKINGS-PUBLICATION-SIBLING: publication sibling read-back restore failed. Fail-closed."; exit 1; }
          node scripts/factory/rankings-db-handoff-manifest.mjs shards-manifest-verify /tmp/vfs-pack-shards-manifest-rb.json --sha="${RB_SM_SHA}" --size="${RB_SM_SIZE}" || { echo "::error::RANKINGS-PUBLICATION-SIBLING: publication sibling read-back failed hash/size/semantic verification. Fail-closed."; exit 1; }
          # (5) export the verified identity for the VFS Derived + Upload consumers.
          echo "staging_prefix=${V_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "set_sha=${V_SET}" >> "$GITHUB_OUTPUT"
          echo "producer_attempt=${ATT}" >> "$GITHUB_OUTPUT"
          echo "warm_read_set_sha=${WARM_SET_SHA}" >> "$GITHUB_OUTPUT"
          # (d) EXPORT THE READ-BACK-PARSED values (never the producer-local SM_SHA/SM_SIZE):
          # these are what both FIX-4 consumers verify-or-recover against.
          echo "shards_manifest_sha=${RB_SM_SHA}" >> "$GITHUB_OUTPUT"
          echo "shards_manifest_size=${RB_SM_SIZE}" >> "$GITHUB_OUTPUT"
          echo "[VFS-PACK-HANDOFF] staging=${V_PREFIX} set_sha256=${V_SET} warm_read_set_sha256=${WARM_SET_SHA} shards_manifest_sha256=${RB_SM_SHA} shards_manifest_size=${RB_SM_SIZE} descriptor=${RUN_PREFIX}/handoff.json"
      # V27.40: end of vfs-pack-db. Save VFS pack output (data/meta/reports/knowledge/mesh)
      # as inter-job cache for vfs-derived. Sitemap + RSS + health move to vfs-derived job.
      # P3-EVIDENCE-1 STAGE-B: the save key carries VFS_PACK_CODE_VERSION so a fresh
      # pack is stored under the current-version prefix only. output/meta/ carries the
      # version sentinel written by the packer step, so a restore on the matching key
      # recovers BOTH the rows and the sentinel (skip-gate's content check).
      - name: Save VFS Pack Output to Cache
        if: success() && steps.detect-vfs-pack.outputs.skip_compute != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            output/data/
            output/meta/
            output/cache/reports/
            output/cache/knowledge/
            output/cache/mesh/
            output/cache/assertions/
          key: intra-4-4-vfs-pack-${{ env.VFS_PACK_CODE_VERSION }}-${{ needs.check-upstream.outputs.upstream-run-id }}-${{ github.run_id }}

  # V27.40: vfs-derived = sitemap-gen + RSS-gen + SQL-health + cache saves.
  # MEASURED BUDGET (2026-08-01). EVIDENCE ANCHOR: run 30630342243 = the 2026-07-31
  # job-level timeout incident, in which VFS Derived was cancelled at 30m09s with only
  # 81 of 98 databases health-verified (the cycle was NOT publishable and Final Upload
  # correctly skipped). The three preceding SUCCESSFUL runs measured 25m38s / 25m39s /
  # 26m27s = 85.4% / 85.5% / 88.2% of the OLD 30-minute ceiling, i.e. 3-4 minutes of
  # headroom and no capacity to absorb any I/O tail. On 2026-07-31 the meta/ restore-dir
  # went 212-228s -> 637.5s (3.00x on an IDENTICAL 108-object payload) and the job could
  # not finish. Worst-observed component sum = 34m32s. Variance+growth model (one further
  # 1.5x R2 tail excursion AND +25% hash-shard count) = 44m51s. 60 minutes carries 1.74x
  # over the worst behaviour ever observed and 1.34x over the growth model; 90 minutes has
  # NO measurement behind it and would only delay incident detection.
  # DO NOT TRUST THIS NUMBER - RE-DERIVE IT: the budget reporter at the end of this job
  # prints [VFS-DERIVED-BUDGET] used_pct every run and warns at 70% / 85%.
  # Recovery: GHA UI "Re-run failed jobs" — run_id stable. The former five-minute
  # cache-hit recovery claim is WITHDRAWN as obsolete: the intra-4-4 vfs-pack GHA cache
  # has been write-denied ("cache write denied: token has no writable scopes") for at
  # least four consecutive cycles and never hits, so R2 exact-staging recovery is the
  # PERMANENT path and structurally costs 548-1022s of every cycle.
  # No R2 fallback for vfs-pack cache miss (state/cycle-output/ does NOT contain meta-NN.db).
  # TELEMETRY BOUNDARY (truthful, do not overstate): the `if: always()` budget reporter at
  # the end of this job is REQUIRED to execute after an ordinary step failure and after a
  # STEP-level timeout where the runner remains available. Its execution is NOT guaranteed
  # after a JOB-level timeout, an external cancellation, or runner loss - in those cases
  # reporting is BEST-EFFORT ONLY. The step-level timeouts added below (30 min on the D-245
  # R2 recovery, 25 min on the SQL health check) are valuable because they convert the two
  # main hang paths into `failure` BEFORE the 60-minute job ceiling, which RAISES THE
  # PROBABILITY that the reporter runs. That is a probability improvement, NOT a guarantee.
  vfs-derived:
    name: VFS Derived (Sitemap + RSS + Health)
    needs: [vfs-pack-db, check-upstream]
    runs-on: ubuntu-latest
    # ANTI-DRIFT: GitHub does NOT expose the `env` context to a job-level
    # `timeout-minutes:` key, so the literal here and VFS_DERIVED_TIMEOUT_MIN below are a
    # DELIBERATE duplicate. tests/unit/vfs-derived-timeout-budget-workflow.test.ts ties the
    # two numerically so they can never drift apart.
    timeout-minutes: 60
    env:
      VFS_DERIVED_TIMEOUT_MIN: '60'
    # D-245 SECONDARY: expose the VERIFIED vfs-derived (sitemaps + RSS) R2 authority so
    # Final Upload publishes ONLY the current-cycle sitemap/RSS identity (the sitemap/RSS
    # GHA caches have no R2 fallback, so the same token denial could otherwise ship a
    # stale/empty sitemap — an SEO wipe of the append-only corpus).
    outputs:
      verified_vfs_derived_staging_prefix: ${{ steps.vfs-derived-handoff.outputs.staging_prefix }}
      verified_vfs_derived_set_sha: ${{ steps.vfs-derived-handoff.outputs.set_sha }}
      verified_vfs_derived_producer_attempt: ${{ steps.vfs-derived-handoff.outputs.producer_attempt }}
    steps:
      # PHASE TELEMETRY (1/8) `setup`. Emitted FIRST so every later phase elapsed is measured
      # against a real job-start anchor and the budget reporter always has at least one mark.
      - name: Phase Mark (setup)
        run: |
          set -euo pipefail
          printf '%s\t%s\n' 'setup' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
      - uses: actions/checkout@v5
      - uses: ./.github/actions/factory-setup
        with:
          aggressive-disk-cleanup: 'false'
          with-rust-ffi: 'false'
      # P3-EVIDENCE-1 STAGE-B: vfs-derived may restore ONLY output of the matching pack
      # version — the key + restore-keys prefix carry VFS_PACK_CODE_VERSION so a
      # cross-version vfs-pack cache can never be pulled into the derived (sitemap/RSS/
      # health) job that runs over the packed meta-NN.db.
      # PHASE TELEMETRY (2/8) `restore` = the GHA cache restore + the D-245 R2 exact-staging
      # recovery. The cache restore is a `uses:` step and cannot carry an inline mark, so an
      # adjacent one-line `run:` step emits it immediately before the phase begins.
      - name: Phase Mark (restore)
        run: |
          set -euo pipefail
          printf '%s\t%s\n' 'restore' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
      - name: Restore VFS Pack Output from intra-cache
        id: cache-restore-vfs-pack
        uses: actions/cache/restore@v5
        with:
          path: |
            output/data/
            output/meta/
            output/cache/reports/
            output/cache/knowledge/
            output/cache/mesh/
            output/cache/assertions/
          key: intra-4-4-vfs-pack-${{ env.VFS_PACK_CODE_VERSION }}-${{ needs.check-upstream.outputs.upstream-run-id }}-${{ github.run_id }}
          # D-245: restore-keys PREFIX authority REMOVED. The GHA cache is an OPTIONAL
          # exact-key fast path only; a restore-keys prefix hit is identity-ambiguous and
          # was previously consumed UNVERIFIED. The vfs-pack-db VERIFIED R2 authority (set
          # hash + manifest) in the next step is the correctness source of truth.
      # D-245 PRIMARY CONSUMER — verify-or-recover BEFORE the defensive guard. The GHA
      # vfs-pack cache (exact key, NO restore-keys) is an OPTIONAL fast path; the
      # vfs-pack-db VERIFIED R2 authority is the truth. Verify the restored meta-NN.db
      # set's manifest/set hash EQUALS vfs-pack-db's exported identity; on GHA miss OR
      # mismatch wipe output/data/ + recover from the EXACT producer staging prefix +
      # re-verify (fail-loud). ONLY THEN the META>=1 guard runs — now backstopped by
      # durable R2, so it means "genuine content void", not "cache unretrievable".
      # AUTHORITY-W (4/4): verify-or-recover BOTH the meta-NN.db set AND the warm-read
      # sibling (bins + term_index) against the vfs-pack authority. SELF-STRIP KILL: the
      # recover restore-dir brings back the FULL output/data/ (meta .db + warm) from the
      # SAME attempt prefix, and warm is then VERIFIED (not ignored via --ext=.db) so a
      # missing/stale warm-tier artifact fails BEFORE the SQL health check + sitemap gen.
      - name: Verify or Recover VFS Pack from Exact Staging (D-245)
        # STEP-LEVEL CEILING (2026-08-01): worst observed 17m02s (run 30630342243) -> 30 min
        # = 1.76x. A genuinely HUNG R2 restore now fails THIS STEP with conclusion `failure`
        # instead of silently consuming the whole job budget and surfacing as an ambiguous
        # job-level `cancelled`. It also fails BEFORE the 60-minute job ceiling, which RAISES
        # THE PROBABILITY that the always() budget reporter still executes - best-effort, not
        # guaranteed (see the TELEMETRY BOUNDARY note on this job).
        timeout-minutes: 30
        env:
          STAGING_PREFIX: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_staging_prefix }}
          EXPECT_SET_SHA: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_set_sha }}
          EXPECT_WARM_SET_SHA: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_warm_read_set_sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -uo pipefail
          if [ -z "${STAGING_PREFIX}" ] || [ -z "${EXPECT_SET_SHA}" ]; then
            echo "::error::vfs-pack-db did not export a verified vfs-pack identity — cannot consume meta-NN.db safely."; exit 1
          fi
          if [ -z "${EXPECT_WARM_SET_SHA}" ]; then
            echo "::error::AUTH-W: vfs-pack-db did not export a verified warm_read set-sha — cannot consume warm-tier safely. Fail-closed."; exit 1
          fi
          # Fetch the producer manifest from R2 (small) to verify the GHA-restored set.
          verify() {
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}manifest.json" /tmp/vfs-pack-manifest.json --strict >/dev/null 2>&1 || return 1
            node scripts/factory/vfs-derived-handoff-manifest.mjs verify output/data/ /tmp/vfs-pack-manifest.json --carrier=vfs-pack-authority --ext=.db
          }
          verify_warm() {
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}warm-read-manifest.json" /tmp/vfs-warm-read-manifest.json --strict >/dev/null 2>&1 || return 1
            node scripts/factory/vfs-derived-handoff-manifest.mjs verify-warm-read output/data/ /tmp/vfs-warm-read-manifest.json --carrier=vfs-pack-authority
          }
          NEED_RECOVER=0
          if OUT=$(verify) && [ "$(printf '%s' "$OUT" | tail -n1)" = "$EXPECT_SET_SHA" ]; then
            echo "[VFS-PACK-HANDOFF] GHA fast-path meta-NN.db matches producer set_sha=$EXPECT_SET_SHA"
          else
            echo "[VFS-PACK-HANDOFF] GHA meta miss/mismatch — recover from exact staging"; NEED_RECOVER=1
          fi
          if OUTW=$(verify_warm) && [ "$(printf '%s' "$OUTW" | tail -n1)" = "$EXPECT_WARM_SET_SHA" ]; then
            echo "[VFS-PACK-HANDOFF] GHA fast-path warm_read matches producer set_sha=$EXPECT_WARM_SET_SHA"
          else
            echo "[VFS-PACK-HANDOFF] GHA warm_read miss/mismatch — recover from exact staging"; NEED_RECOVER=1
          fi
          if [ "$NEED_RECOVER" = "1" ]; then
            rm -rf output/data/; mkdir -p output/data/
            # D-302: restore EACH producer role EXPLICITLY from its OWN sub-prefix into the
            # correct output/data/ layout. Role sub-prefixing gives each backup-dir its OWN
            # _manifest.json restore index, so the meta (.db incl. meta-00.db) restore set can
            # NEVER be overwritten by the warm (.bin) set (the D-245 last-writer-wins bug). Each
            # restore-dir --strict fails CLOSED on a missing/empty R2 role (no partial recovery).
            # This is a PURE R2 recovery — NO GHA-cache data is consulted on this path; a GHA miss
            # OR save-denial forces this exact R2 restore, never a failure.
            node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}meta/" output/data/ --strict
            node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}warm/" output/data/ --strict
            node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}term_index/" output/data/term_index/ --strict
            # Defensive: never let a handoff sidecar leak into the public data/ tree.
            rm -f output/data/manifest.json output/data/warm-read-manifest.json output/data/handoff.json output/data/_manifest.json 2>/dev/null || true
            OUT=$(verify) || { echo "::error::VFS-pack exact-staging recovery failed verification ($STAGING_PREFIX). Fail-closed."; exit 1; }
            [ "$(printf '%s' "$OUT" | tail -n1)" = "$EXPECT_SET_SHA" ] || { echo "::error::Recovered meta set hash != producer $EXPECT_SET_SHA. Fail-closed."; exit 1; }
            OUTW=$(verify_warm) || { echo "::error::AUTH-W: warm_read exact-staging recovery failed verification ($STAGING_PREFIX). Fail-closed."; exit 1; }
            [ "$(printf '%s' "$OUTW" | tail -n1)" = "$EXPECT_WARM_SET_SHA" ] || { echo "::error::AUTH-W: recovered warm_read set hash != producer $EXPECT_WARM_SET_SHA. Fail-closed."; exit 1; }
            echo "[VFS-PACK-HANDOFF] recovered + verified meta-NN.db + warm_read from exact staging"
          fi
          # PATH TELEMETRY - UNCONDITIONAL, BOTH BRANCHES. Makes "did this cycle take the GHA
          # fast path or the R2 exact-staging recovery?" greppable rather than inferred from
          # prose. Emitted after the verify/recover decision is final, so it reports the path
          # actually taken. Four consecutive cycles have taken r2-exact-staging-recovery.
          if [ "$NEED_RECOVER" = "1" ]; then
            echo "[VFS-DERIVED-PATH] vfs_pack_source=r2-exact-staging-recovery"
          else
            echo "[VFS-DERIVED-PATH] vfs_pack_source=gha-cache-fastpath"
          fi
      # RANKINGS-PUBLICATION-SIBLING-RECOVERY (D-395), VFS Derived. pack-finalizer is the ONLY writer of
      # output/data/shards_manifest.json, and the FIX-4 recovery immediately above does
      # `rm -rf output/data/` then restores ONLY .db / warm .bin / term_index -- so on that
      # path (and on the skip-compute path, where the Packer never ran) the publication
      # manifest is ABSENT. The D9b pre-publish gate legitimately REQUIRES it, so recover
      # it from the ADDITIVE attempt-scoped sibling instead of weakening the gate.
      # VERIFY-OR-RECOVER: missing OR hash-mismatch OR unparseable OR
      # partitions.rankings_dbs !== true all count as "must recover"; recovery is
      # restore-file --strict from the EXACT attempt prefix, then RE-VERIFIED. The gate
      # itself is untouched and the manifest is NEVER fabricated or boolean-patched here:
      # the only thing that can satisfy this step is the producer-verified authority copy.
      - name: Verify or Recover Published shards_manifest.json from VFS Pack Authority (D-395)
        env:
          STAGING_PREFIX: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_staging_prefix }}
          EXPECT_SM_SHA: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_shards_manifest_sha }}
          EXPECT_SM_SIZE: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_shards_manifest_size }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -uo pipefail
          MOD=scripts/factory/rankings-db-handoff-manifest.mjs
          if [ -z "${STAGING_PREFIX}" ] || [ -z "${EXPECT_SM_SHA}" ] || [ -z "${EXPECT_SM_SIZE}" ]; then
            echo "::error::RANKINGS-PUBLICATION-SIBLING-RECOVERY/VFS-DERIVED: vfs-pack-db exported no verified shards_manifest sibling identity. Fail-closed."; exit 1
          fi
          verify_sm() { node "$MOD" shards-manifest-verify output/data/shards_manifest.json --sha="${EXPECT_SM_SHA}" --size="${EXPECT_SM_SIZE}"; }
          if verify_sm >/dev/null; then
            echo "[RANKINGS-PUBLICATION-SIBLING] output/data/shards_manifest.json already matches the authority sibling"
          else
            echo "[RANKINGS-PUBLICATION-SIBLING] shards_manifest.json missing/mismatched/unparseable/flag-not-true -- recover from exact staging"
            mkdir -p output/data
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}publication/shards_manifest.json" output/data/shards_manifest.json --strict || { echo "::error::RANKINGS-PUBLICATION-SIBLING-RECOVERY/VFS-DERIVED: publication sibling recovery restore failed (${STAGING_PREFIX}publication/shards_manifest.json). Fail-closed."; exit 1; }
            verify_sm || { echo "::error::RANKINGS-PUBLICATION-SIBLING-RECOVERY/VFS-DERIVED: recovered shards_manifest.json failed hash/size/semantic re-verification. Fail-closed."; exit 1; }
            echo "[RANKINGS-PUBLICATION-SIBLING] recovered + re-verified shards_manifest.json from the exact attempt prefix"
          fi
      # V27.40.1 + V27.52: fail-fast on missing meta-NN.db. File-existence detection
      # (cache-hit output false-fires on restore-keys partial match).
      - name: Verify VFS Pack Files Present (defensive)
        run: |
          META_COUNT=$(find output/data -name 'meta-*.db' 2>/dev/null | wc -l)
          if [ "$META_COUNT" -lt 1 ]; then
            echo "::error::No meta-NN.db found post-restore. vfs-pack-db should have written via primary key OR restore-keys partial hit. Aborting vfs-derived to avoid empty sitemap/RSS output."
            exit 1
          fi
          echo "✅ VFS pack present: $META_COUNT meta-NN.db files"
      - name: Generate VFS-Parity Sitemaps
        run: |
          set -euo pipefail
          # PHASE TELEMETRY (3/8) `sitemap`. FIRST line of this phase's OWN run: body, so a
          # phase that executes CANNOT omit its mark.
          printf '%s\t%s\n' 'sitemap' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
          node scripts/factory/vfs-sitemap-gen.js --db=output/data/meta-00.db --out=output
      # D-246 RSS INPUT RECOVERY. The RSS-generator inputs (output/cache/{reports,knowledge}/
      # index.json.zst) are now carried durably by the vfs-pack R2 authority. Recover every
      # DECLARED-PRESENT input from the EXACT current-cycle staging BEFORE rss-generator +
      # fail-closed verify (states 3/4/6/7/8 => exit 1); SKIP declared-absent (paused/
      # floor-zero) inputs (states 1/5) — a present input can never be silently lost, while
      # the paused/static-historical RSS behavior is preserved (RSS is NOT forced non-empty).
      - name: Recover VFS-Pack RSS Inputs from Exact Staging (D-246)
        env:
          STAGING_PREFIX: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_staging_prefix }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -uo pipefail
          # PHASE TELEMETRY (4/8) `rss`. FIRST line of this phase's OWN run: body.
          printf '%s\t%s\n' 'rss' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
          if [ -z "${STAGING_PREFIX}" ]; then echo "::error::no verified vfs-pack staging prefix for RSS inputs."; exit 1; fi
          # The verified producer manifest (with rss_inputs) is at /tmp/vfs-pack-manifest.json
          # from the meta verify-or-recover step; re-fetch defensively if absent.
          if [ ! -s /tmp/vfs-pack-manifest.json ]; then
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}manifest.json" /tmp/vfs-pack-manifest.json --strict
          fi
          node scripts/factory/vfs-derived-handoff-manifest.mjs rss-recovery-plan /tmp/vfs-pack-manifest.json --carrier=vfs-pack-authority > /tmp/vfs-pack-rss-plan.tsv
          while IFS=$'\t' read -r RSS_STAGED RSS_LOCAL RSS_SHA; do
            [ -z "$RSS_STAGED" ] && continue
            mkdir -p "$(dirname "$RSS_LOCAL")"
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}${RSS_STAGED}" "$RSS_LOCAL" --strict || { echo "::error::RSS input recovery failed for ${RSS_STAGED} (declared present). Fail-closed."; exit 1; }
          done < /tmp/vfs-pack-rss-plan.tsv
          # Fail-closed verify: every declared-present input recovered + sha matches (states
          # 3/4/6/7/8 => exit 1); declared-absent skipped + recorded (states 1/5 non-fatal).
          node scripts/factory/vfs-derived-handoff-manifest.mjs verify-rss-inputs /tmp/vfs-pack-manifest.json . --carrier=vfs-pack-authority
          echo "[VFS-PACK-HANDOFF] RSS inputs: declared-present recovered+verified from exact staging; declared-absent skipped (paused/floor-zero)"
      # V25.13: RSS gen requires output/cache/reports/index.json.zst (from pack-db meta-anchors)
      # — guaranteed present via vfs-pack cache restore above.
      # V27.39: soft-warn when both feeds empty (V27.36 paused daily reports + knowledge-ai).
      - name: Generate RSS feeds
        run: node scripts/factory/lib/rss-generator.js ./output
      # AUTHORITY-M CONSUMER (vfs-derived; the missing output/cache/mesh recovery seam):
      # verify-or-recover the dict + profile-shards against the current-cycle mesh-profile
      # authority BEFORE the V23.1 SQL Health Check, whose verify-db canary (loadBakedDict)
      # resolves ui_related_mesh refs from the dict. Without this, a GHA-cache miss left the
      # dict/shards unrecovered and the canary under-reported coverage. Fail-closed on a
      # missing descriptor / residual mismatch.
      - name: Verify or Recover Mesh Profiles from Exact Staging (AUTH-M)
        env:
          HANDOFF_UPSTREAM_RUN_ID: ${{ needs.check-upstream.outputs.upstream-run-id }}
          HANDOFF_FACTORY_RUN_ID: ${{ github.run_id }}
          HANDOFF_RUN_ATTEMPT: ${{ github.run_attempt }}
          HANDOFF_HEAD_SHA: ${{ github.sha }}
          HANDOFF_MESH_CODE_VERSION: ${{ env.MESH_PROFILE_CODE_VERSION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -uo pipefail
          # PHASE TELEMETRY (5/8) `mesh-profiles`. FIRST line of this phase's OWN run: body.
          printf '%s\t%s\n' 'mesh-profiles' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
          UP="${HANDOFF_UPSTREAM_RUN_ID}"; RUN="${HANDOFF_FACTORY_RUN_ID}"
          if [ -z "$UP" ] || [ -z "$RUN" ]; then echo "::error::AUTH-M: missing run identity — cannot consume mesh-profiles safely."; exit 1; fi
          DESC="state/_handoff/mesh-profile/${UP}/${RUN}/handoff.json"
          node scripts/factory/r2-workflow-cli.js restore-file "$DESC" /tmp/mesh-profile-handoff-rb.json --strict || { echo "::error::AUTH-M: no current-cycle mesh-profile authority descriptor ($DESC). Fail-closed."; exit 1; }
          OUT=$(node scripts/factory/mesh-profile-handoff-manifest.mjs verify-descriptor /tmp/mesh-profile-handoff-rb.json --carrier=mesh-profile-authority) || { echo "::error::AUTH-M: descriptor provenance invalid. Fail-closed."; exit 1; }
          STAGING_PREFIX=$(printf '%s' "$OUT" | cut -f1); EXPECT_SET_SHA=$(printf '%s' "$OUT" | cut -f2)
          node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}manifest.json" /tmp/mesh-profile-manifest.json --strict || { echo "::error::AUTH-M: manifest missing at ${STAGING_PREFIX}. Fail-closed."; exit 1; }
          verify_mesh() { node scripts/factory/mesh-profile-handoff-manifest.mjs verify output/cache/mesh /tmp/mesh-profile-manifest.json --carrier=mesh-profile-authority; }
          NEED_RECOVER=0
          if OUT2=$(verify_mesh) && [ "$(printf '%s' "$OUT2" | tail -n1)" = "$EXPECT_SET_SHA" ]; then
            echo "[MESH-PROFILE-HANDOFF] fast-path mesh-profile matches producer set_sha=$EXPECT_SET_SHA"
          else
            echo "[MESH-PROFILE-HANDOFF] miss/mismatch — recover from exact staging"; NEED_RECOVER=1
          fi
          if [ "$NEED_RECOVER" = "1" ]; then
            rm -rf output/cache/mesh/profile-shards output/cache/mesh/profile-evidence-dict.json.zst; mkdir -p output/cache/mesh
            node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}profile-shards/" output/cache/mesh/profile-shards/ --strict || { echo "::error::AUTH-M: mesh recovery restore failed (${STAGING_PREFIX}profile-shards/). Fail-closed."; exit 1; }
            node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}profile-evidence-dict.json.zst" output/cache/mesh/profile-evidence-dict.json.zst --strict || { echo "::error::AUTH-M: mesh recovery restore failed (${STAGING_PREFIX}profile-evidence-dict.json.zst). Fail-closed."; exit 1; }
            rm -f output/cache/mesh/manifest.json output/cache/mesh/handoff.json output/cache/mesh/_manifest.json 2>/dev/null || true
            OUT2=$(verify_mesh) || { echo "::error::AUTH-M: exact-staging recovery failed verification (${STAGING_PREFIX}). Fail-closed."; exit 1; }
            [ "$(printf '%s' "$OUT2" | tail -n1)" = "$EXPECT_SET_SHA" ] || { echo "::error::AUTH-M: recovered set hash != producer $EXPECT_SET_SHA. Fail-closed."; exit 1; }
            echo "[MESH-PROFILE-HANDOFF] recovered + verified mesh-profile from exact staging"
          fi
      # V23.1 SQL HEALTH CHECK + FAIL-CLOSED INDEPENDENT-AUTHORITY MEMBER-SET CENSUS GATE.
      #
      # WHY THIS GATE EXISTS. On 2026-07-31 (run 30630342243) this loop checked 81 of 98
      # databases and the job was cancelled. Nothing in the job ASSERTED the shortfall - the
      # "Final Upload cannot publish after partial health checking" rule held only IMPLICITLY,
      # because a cancelled step skips the downstream `if: success()` steps and `upload.needs`
      # then skips. That is an emergent property of step ordering, not an asserted invariant:
      # if this loop ever exits 0 early (a future `continue`, a glob that matches nothing, a
      # `|| true`) the job would go GREEN on a partial set and publish. This gate converts the
      # implicit property into an explicit, machine-checked, fail-closed assertion.
      #
      # INDEPENDENT AUTHORITY. EXPECTED comes ENTIRELY from the vfs-pack PRODUCER MANIFEST
      # (/tmp/vfs-pack-manifest.json), restored from the EXACT producer staging prefix and
      # ALREADY verified by the D-245 step above (exact set equality + per-file sha256 +
      # set_sha256 == the vfs-pack-db descriptor's exported set-sha). It is produced by a
      # DIFFERENT job and stored in R2, so the directory under test contributes ZERO expected
      # names. Runtime directory enumeration is used ONLY to enumerate PRESENT members.
      # Count-only equality is NOT sufficient and is NOT what this gate does: it compares
      # MEMBER IDENTITIES, sorted, line for line.
      #
      # PRODUCER-SIDE FLOOR GAP, CLOSED EXPLICITLY. The manifest's ONLY declared required
      # class is meta_db (/(^|\/)meta-\d+\.db$/, min 1). meta-knowledge.db and meta-report.db
      # match NO required class, so a manifest missing them would be SELF-CONSISTENT, would
      # pass its own verification, and would silently yield 97 instead of 98. The census
      # therefore asserts those two BY NAME against the manifest. That is an assertion against
      # an INDEPENDENT CARRIER, not an expected list invented from the directory under test;
      # both names are load-bearing repo constants (produced by
      # scripts/factory/lib/meta-anchors.js, consumed by src/pages/api/v1/concepts.ts and
      # src/pages/{knowledge,trends}.astro, pinned by tests/unit/r5-vfs-idindex-b4.test.ts).
      #
      # RANKINGS. The 10 rankings DBs are a SEPARATE canonical authority
      # (src/constants/rankings-groups.js, EXACTLY 10) and are not part of the non-ranking
      # health set. They are excluded BY THAT CANONICAL NAME LIST on BOTH sides, never by
      # pattern guessing - so a stray rankings-<unknown>.db still surfaces as unexpected.
      # 96 meta-NN.db + meta-knowledge.db + meta-report.db + 10 rankings = the 108 .db members
      # the producer manifest carries today; 108 - 10 = the 98 members checked here.
      #
      # NOTHING IS WEAKENED: same `node scripts/factory/verify-db.js` call, same member set,
      # same ASCII order, same fail-closed `set -e`. verify-db.js is NOT modified.
      - name: V23.1 SQL Health Check
        # STEP-LEVEL CEILING: full-set projection 13m06s at the worst measured per-shard rate
        # -> 25 min = 1.91x. Converts a hung health loop into `failure` before the job ceiling.
        timeout-minutes: 25
        env:
          VFS_PACK_MANIFEST: /tmp/vfs-pack-manifest.json
          CENSUS_EXPECTED_FILE: /tmp/vfs-derived-expected-members.txt
          CENSUS_PRESENT_FILE: /tmp/vfs-derived-present-members.txt
          CENSUS_COMPLETED_FILE: /tmp/vfs-derived-completed-members.txt
        run: |
          set -euo pipefail
          # PHASE TELEMETRY (6/8) `sql-health`. FIRST line of this phase's OWN run: body.
          printf '%s\t%s\n' 'sql-health' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
          [ -s "$VFS_PACK_MANIFEST" ] || { echo "::error::VFS-DERIVED-CENSUS MANIFEST_ABSENT: the vfs-pack producer manifest ($VFS_PACK_MANIFEST) is missing or empty - the independent expected-member authority is unavailable. Fail-closed."; exit 1; }
          cat > /tmp/vfs-derived-census.mjs <<'VFS_DERIVED_CENSUS_EOF'
          // Emits the EXPECTED member set (independent producer authority) and the PRESENT
          // member set (runtime directory enumeration), then fails closed on any divergence.
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const MANIFEST = process.env.VFS_PACK_MANIFEST;
          const DATA_DIR = "output/data";
          const ANCHOR_MEMBERS = ["meta-knowledge.db", "meta-report.db"];
          const META_SHARD_RE = /^meta-\d+\.db$/;
          const die = (code, msg) => {
            console.log(`::error::VFS-DERIVED-CENSUS ${code}: ${msg} Fail-closed.`);
            process.exit(1);
          };

          // >>> EXPECTED-DERIVATION BEGIN (INDEPENDENT PRODUCER AUTHORITY ONLY) <<<
          // The directory under test contributes ZERO names to EXPECTED.
          let manifest;
          try { manifest = JSON.parse(fs.readFileSync(MANIFEST, "utf8")); }
          catch (e) { die("MANIFEST_UNREADABLE", `cannot read the producer manifest ${MANIFEST}: ${e.message}.`); }
          if (manifest.carrier_type !== "vfs-pack-authority") die("MANIFEST_CARRIER_WRONG", `carrier_type "${manifest.carrier_type}" is not vfs-pack-authority.`);
          if (!Array.isArray(manifest.files) || manifest.files.length === 0) die("MANIFEST_FILES_EMPTY", "the producer manifest carries no member identities.");
          const rg = await import(pathToFileURL(path.resolve("src/constants/rankings-groups.js")).href);
          const RANKINGS = new Set(rg.RANKINGS_DB_NAMES);
          if (RANKINGS.size !== 10 || RANKINGS.size !== rg.RANKINGS_DB_COUNT) die("RANKINGS_AUTHORITY_UNEXPECTED", `the canonical rankings set is ${RANKINGS.size}, expected exactly 10.`);
          const carried = [];
          for (const f of manifest.files) {
            const rel = String((f && f.relative_path) || "");
            if (!rel.endsWith(".db")) continue;
            if (rel.includes("/")) die("MEMBER_NAME_INVALID", `manifest .db member is not a flat output/data member: "${rel}".`);
            carried.push(rel);
          }
          const dupes = [...new Set(carried.filter((n, i) => carried.indexOf(n) !== i))];
          if (dupes.length) die("MEMBER_DUPLICATE", `duplicate .db member(s) in the producer manifest: ${dupes.join(",")}.`);
          const expected = carried.filter((n) => !RANKINGS.has(n)).sort();
          if (expected.length === 0) die("EXPECTED_SET_EMPTY", "the expected member set is EMPTY - refusing to health-check a vacuous set.");
          for (const n of expected) {
            if (!META_SHARD_RE.test(n) && !ANCHOR_MEMBERS.includes(n)) die("MEMBER_NAME_INVALID", `unrecognised non-ranking .db member "${n}".`);
          }
          if (!expected.some((n) => META_SHARD_RE.test(n))) die("EXPECTED_META_ZERO", "the expected set contains no meta-NN.db hash shard.");
          for (const a of ANCHOR_MEMBERS) {
            if (!expected.includes(a)) die("ANCHOR_MEMBER_ABSENT", `required non-ranking database "${a}" is ABSENT from the producer manifest (no required-class floor covers it).`);
          }
          // >>> EXPECTED-DERIVATION END <<<

          // >>> PRESENT-DERIVATION BEGIN (RUNTIME DIRECTORY ENUMERATION) <<<
          // Permitted to enumerate PRESENT members. NEVER defines EXPECTED.
          let dirents;
          try { dirents = fs.readdirSync(DATA_DIR, { withFileTypes: true }); }
          catch (e) { die("DATA_DIR_UNREADABLE", `cannot enumerate ${DATA_DIR}: ${e.message}.`); }
          const present = dirents.filter((d) => d.isFile() && d.name.endsWith(".db") && !RANKINGS.has(d.name)).map((d) => d.name).sort();
          // >>> PRESENT-DERIVATION END <<<

          const preSet = new Set(present);
          const expSet = new Set(expected);
          const metaN = expected.filter((n) => META_SHARD_RE.test(n)).length;
          console.log(`[VFS-DERIVED-CENSUS] expected_db=${expected.length} expected_meta=${metaN} present_db=${present.length} rankings_excluded=${RANKINGS.size} expected_source=vfs-pack-producer-manifest(${MANIFEST}) present_source=runtime-dir(${DATA_DIR})`);
          const missing = expected.filter((n) => !preSet.has(n));
          if (missing.length) die("MEMBER_MISSING", `expected member(s) absent from ${DATA_DIR}: ${missing.join(",")}.`);
          const unexpected = present.filter((n) => !expSet.has(n));
          if (unexpected.length) die("MEMBER_UNEXPECTED", `unexpected non-ranking database(s) in ${DATA_DIR}: ${unexpected.join(",")}.`);
          fs.writeFileSync(process.env.CENSUS_EXPECTED_FILE, expected.join("\n") + "\n");
          fs.writeFileSync(process.env.CENSUS_PRESENT_FILE, present.join("\n") + "\n");
          console.log(`[VFS-DERIVED-CENSUS] expected==present member-identity check PASSED (${expected.length} members)`);
          VFS_DERIVED_CENSUS_EOF
          node /tmp/vfs-derived-census.mjs
          # The loop is driven BY THE EXPECTED LIST (the independent authority), never by a
          # glob of the directory under test, so EXPECTED can never be re-derived from what
          # happens to be on disk and can never be assigned from COMPLETED.
          TOTAL=$(wc -l < "$CENSUS_EXPECTED_FILE" | tr -d ' ')
          [ "$TOTAL" -gt 0 ] || { echo "::error::VFS-DERIVED-CENSUS EXPECTED_SET_EMPTY: refusing to health-check a vacuous set. Fail-closed."; exit 1; }
          : > "$CENSUS_COMPLETED_FILE"
          I=0; T0=$(date -u +%s)
          while IFS= read -r NAME; do
            [ -n "$NAME" ] || continue
            I=$((I+1))
            echo "[HEALTH $I/$TOTAL] $NAME elapsed=$(( $(date -u +%s) - T0 ))s"
            node scripts/factory/verify-db.js "output/data/$NAME" < /dev/null
            printf '%s\n' "$NAME" >> "$CENSUS_COMPLETED_FILE"
          done < "$CENSUS_EXPECTED_FILE"
          # POST-LOOP MEMBER-SET IDENTITY GATE. Compares IDENTITIES, not counts: a set of the
          # same SIZE with one member swapped for another reds here, as does a missing member,
          # an extra member, a duplicate, and any incomplete health execution.
          sort -o "$CENSUS_COMPLETED_FILE" "$CENSUS_COMPLETED_FILE"
          COMPLETED_N=$(wc -l < "$CENSUS_COMPLETED_FILE" | tr -d ' ')
          echo "[VFS-DERIVED-CENSUS] completed_db=$COMPLETED_N expected_db=$TOTAL"
          if ! diff -u "$CENSUS_EXPECTED_FILE" "$CENSUS_COMPLETED_FILE" > /tmp/vfs-derived-census-set.diff; then
            echo "::error::VFS-DERIVED-CENSUS MEMBER_SET_DIVERGED: the successfully health-checked member set is NOT identical to the independent expected member set (expected $TOTAL, completed $COMPLETED_N). Final Upload MUST NOT publish. Fail-closed."
            sed -n '1,120p' /tmp/vfs-derived-census-set.diff
            exit 1
          fi
          echo "[VFS-DERIVED-CENSUS] PASS expected_member_set == completed_member_set ($COMPLETED_N members, compared by member identity)"
      # D-245 SECONDARY EXACT-PRODUCER R2 HANDOFF (sitemaps + RSS). The vfs-assets +
      # rss-feeds GHA caches are the ONLY carriers of output/sitemaps/ + sitemap.xml +
      # output/rss/ to Final Upload, with NO R2 fallback — the SAME token denial can ship
      # a stale/empty sitemap (an SEO wipe of the append-only corpus). Establish a DURABLE,
      # run + attempt scoped, content-verified authority bound to the vfs-pack set-sha
      # (parent). sitemap class floor >=1 (empty fails); rss floor 0 (the V27.39 empty-feed
      # generator contract). Order: assemble -> manifest -> data FIRST -> manifest LAST ->
      # descriptor LAST OF ALL -> read-back verify -> export. Staging goes to R2 + /tmp only.
      - name: Produce Exact-Producer R2 Handoff (VFS-DERIVED sitemaps/RSS, D-245)
        id: vfs-derived-handoff
        if: success()
        env:
          HANDOFF_UPSTREAM_RUN_ID: ${{ needs.check-upstream.outputs.upstream-run-id }}
          HANDOFF_FACTORY_RUN_ID: ${{ github.run_id }}
          HANDOFF_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          HANDOFF_HEAD_SHA: ${{ github.sha }}
          HANDOFF_VFS_PACK_CODE_VERSION: ${{ env.VFS_PACK_CODE_VERSION }}
          HANDOFF_PARENT_SET_SHA: ${{ needs.vfs-pack-db.outputs.verified_vfs_pack_set_sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -euo pipefail
          UP="${HANDOFF_UPSTREAM_RUN_ID}"; RUN="${HANDOFF_FACTORY_RUN_ID}"; ATT="${HANDOFF_PRODUCER_ATTEMPT}"
          # PHASE TELEMETRY (7/8) `handoff`.
          printf '%s\t%s\n' 'handoff' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
          RUN_PREFIX="state/_handoff/vfs-derived/${UP}/${RUN}"
          export STAGING="${RUN_PREFIX}/attempt-${ATT}/"
          # Assemble the sitemap/RSS carrier set into one staging tree (never uploaded to
          # the public CDN prefix). sitemaps/ + sitemap.xml + rss/ mirror the Final Upload
          # layout; empty rss/ tolerated, empty sitemap fails closed at generate.
          STAGE_LOCAL=/tmp/vfs-derived-stage
          rm -rf "$STAGE_LOCAL"; mkdir -p "$STAGE_LOCAL"
          [ -d output/sitemaps ] && cp -r output/sitemaps "$STAGE_LOCAL/sitemaps" || true
          [ -f output/sitemap.xml ] && cp output/sitemap.xml "$STAGE_LOCAL/sitemap.xml" || true
          [ -d output/rss ] && cp -r output/rss "$STAGE_LOCAL/rss" || true
          # (1) manifest over ALL assembled files (sitemap floor >=1 fails an empty sitemap).
          node scripts/factory/vfs-derived-handoff-manifest.mjs generate "$STAGE_LOCAL" /tmp/vfs-derived-manifest.json --carrier=vfs-derived-authority
          export SET_SHA=$(node -e "process.stdout.write(require('/tmp/vfs-derived-manifest.json').set_sha256)")
          export MANIFEST_SHA=$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync('/tmp/vfs-derived-manifest.json')).digest('hex'))")
          # (2) data FIRST, then manifest.json LAST.
          node scripts/factory/r2-workflow-cli.js backup-dir "$STAGE_LOCAL" "${STAGING}"
          node scripts/factory/r2-workflow-cli.js upload-file /tmp/vfs-derived-manifest.json "${STAGING}manifest.json"
          # (3) descriptor LAST OF ALL — binds the parent vfs-pack set-sha + head-SHA + version.
          node -e "const f=require('fs');f.writeFileSync('/tmp/vfs-derived-handoff.json',JSON.stringify({schema_version:1,carrier_type:'vfs-derived-authority',producer_attempt:Number(process.env.HANDOFF_PRODUCER_ATTEMPT),exact_staging_prefix:process.env.STAGING,manifest_sha256:process.env.MANIFEST_SHA,set_sha256:process.env.SET_SHA,upstream_run_id:String(process.env.HANDOFF_UPSTREAM_RUN_ID),factory_run_id:String(process.env.HANDOFF_FACTORY_RUN_ID),head_sha:String(process.env.HANDOFF_HEAD_SHA),vfs_pack_code_version:String(process.env.HANDOFF_VFS_PACK_CODE_VERSION),parent_set_sha256:(process.env.HANDOFF_PARENT_SET_SHA||null),created_at:new Date().toISOString()}))"
          node scripts/factory/r2-workflow-cli.js upload-file /tmp/vfs-derived-handoff.json "${RUN_PREFIX}/handoff.json"
          # (4) read-back verify + (5) export the verified identity for Final Upload.
          node scripts/factory/r2-workflow-cli.js restore-file "${RUN_PREFIX}/handoff.json" /tmp/vfs-derived-handoff-rb.json --strict
          OUT=$(HANDOFF_RUN_ATTEMPT="${ATT}" node scripts/factory/vfs-derived-handoff-manifest.mjs verify-descriptor /tmp/vfs-derived-handoff-rb.json --carrier=vfs-derived-authority)
          V_PREFIX=$(printf '%s' "$OUT" | cut -f1); V_SET=$(printf '%s' "$OUT" | cut -f2)
          echo "staging_prefix=${V_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "set_sha=${V_SET}" >> "$GITHUB_OUTPUT"
          echo "producer_attempt=${ATT}" >> "$GITHUB_OUTPUT"
          echo "[VFS-DERIVED-HANDOFF] staging=${V_PREFIX} set_sha256=${V_SET} descriptor=${RUN_PREFIX}/handoff.json"
      # PHASE TELEMETRY (8/8) `cache-persist`. The two cache saves are `uses:` steps and
      # cannot carry an inline mark. This NEW step carries its own `if: success()`; the
      # `if: success()` on the existing handoff and cache-save steps is UNCHANGED.
      - name: Phase Mark (cache-persist)
        if: success()
        run: |
          set -euo pipefail
          printf '%s\t%s\n' 'cache-persist' "$(date -u +%s)" >> "$RUNNER_TEMP/vfs-derived-phases.tsv"
      - name: Save VFS Assets to Cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: |
            output/data/
            output/meta/
            output/sitemaps/
            output/sitemap.xml
          key: intra-4-4-vfs-assets-${{ needs.check-upstream.outputs.upstream-run-id }}-${{ github.run_id }}
      - name: Save RSS Feeds to Cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: output/rss/
          key: intra-4-4-rss-feeds-${{ needs.check-upstream.outputs.upstream-run-id }}-${{ github.run_id }}
      # BUDGET REPORTER (2026-08-01). Makes future timeout-budget EROSION observable: on the
      # three 2026-07-28/29/30 successes this reporter would have printed used_pct 88.2 /
      # 85.4 / 85.5 and raised the CRITICAL warning EVERY TIME. The erosion was fully
      # measurable and simply was not measured.
      #
      # EXECUTION BOUNDARY (truthful, do not overstate): `if: always()` makes this step
      # REQUIRED to execute after an ordinary step failure and after a STEP-level timeout
      # where the runner remains available. It does NOT guarantee execution after a JOB-level
      # timeout, an external cancellation, or runner loss - GitHub may cancel the whole job
      # and no further step is guaranteed an execution slot. Reporting in those cases is
      # BEST-EFFORT ONLY. The step-level timeouts (30 min D-245 recovery, 25 min SQL health)
      # convert the two main hang paths into `failure` BEFORE the 60-minute job ceiling and
      # therefore RAISE THE PROBABILITY that this reporter runs - a probability improvement,
      # never a guarantee.
      #
      # FAIL-CLOSED ON ITS OWN INPUTS: a telemetry line that can silently not print is not
      # observability, so a missing/empty/malformed marks file, an unknown or duplicated phase
      # name, an absent `setup` mark, or a missing/non-numeric budget is an ERROR (exit 1),
      # never a silent skip. Phases that legitimately did not run (e.g. handoff after a health
      # failure) are NOT required - only the marks that were actually emitted are validated.
      - name: VFS Derived Phase + Budget Report
        if: always()
        run: |
          set -euo pipefail
          MARKS="$RUNNER_TEMP/vfs-derived-phases.tsv"
          BUDGET_MIN="${VFS_DERIVED_TIMEOUT_MIN:-}"
          case "$BUDGET_MIN" in
            ''|*[!0-9]*) echo "::error::VFS-DERIVED-BUDGET BUDGET_INPUT_INVALID: VFS_DERIVED_TIMEOUT_MIN is missing or non-numeric ('$BUDGET_MIN'). Fail-closed."; exit 1;;
          esac
          [ "$BUDGET_MIN" -gt 0 ] || { echo "::error::VFS-DERIVED-BUDGET BUDGET_INPUT_INVALID: VFS_DERIVED_TIMEOUT_MIN must be greater than 0. Fail-closed."; exit 1; }
          [ -s "$MARKS" ] || { echo "::error::VFS-DERIVED-BUDGET MARKS_ABSENT: the phase-marks file is missing or empty ($MARKS). Missing telemetry is an ERROR, never a silent skip. Fail-closed."; exit 1; }
          NOW=$(date -u +%s)
          awk -F'\t' -v now="$NOW" -v budget_min="$BUDGET_MIN" '
            BEGIN {
              split("setup restore sitemap rss mesh-profiles sql-health handoff cache-persist", k, " ");
              for (i in k) known[k[i]] = 1;
              n = 0;
            }
            {
              if (NF != 2 || $1 == "" || $2 !~ /^[0-9]+$/) { printf "::error::VFS-DERIVED-BUDGET MARK_MALFORMED: line %d is not <phase>\\t<epoch>. Fail-closed.\n", NR; bad = 1; exit 1 }
              if (!($1 in known)) { printf "::error::VFS-DERIVED-BUDGET MARK_UNKNOWN_PHASE: \"%s\" is not a declared phase. Fail-closed.\n", $1; bad = 1; exit 1 }
              if ($1 in seen) { printf "::error::VFS-DERIVED-BUDGET MARK_DUPLICATE: phase \"%s\" marked more than once. Fail-closed.\n", $1; bad = 1; exit 1 }
              seen[$1] = 1; order[++n] = $1; at[$1] = $2 + 0;
            }
            END {
              if (bad) { exit 1 }
              if (n == 0) { print "::error::VFS-DERIVED-BUDGET MARKS_EMPTY: no phase marks were recorded. Fail-closed."; exit 1 }
              if (!("setup" in seen)) { print "::error::VFS-DERIVED-BUDGET MARK_SETUP_ABSENT: the setup phase mark is absent, so no job-start anchor exists. Fail-closed."; exit 1 }
              printf "| phase | started (epoch) | elapsed_s |\n|---|---:|---:|\n";
              for (i = 1; i <= n; i++) {
                p = order[i];
                e = (i < n ? at[order[i+1]] : now) - at[p];
                printf "| %s | %d | %d |\n", p, at[p], e;
              }
              total = now - at["setup"];
              budget = budget_min * 60;
              pct = (budget > 0 ? total * 100.0 / budget : 0);
              printf "\n[VFS-DERIVED-BUDGET] total_elapsed_s=%d budget_s=%d used_pct=%.1f phases_marked=%d\n", total, budget, pct, n;
              if (pct >= 85) printf "::warning::VFS Derived budget erosion CRITICAL: %.1f%% of its %d-minute timeout consumed. Re-derive the budget NOW.\n", pct, budget_min;
              else if (pct >= 70) printf "::warning::VFS Derived budget erosion: %.1f%% of its %d-minute timeout consumed. Re-derive the budget.\n", pct, budget_min;
            }
          ' "$MARKS" | tee -a "$GITHUB_STEP_SUMMARY"
          # `set -o pipefail` propagates the awk fail-closed exits through the tee pipeline.

  # V25.13: rss-feeds job DELETED — RSS gen moved into vfs-packing (now vfs-derived).
  # V27.40: vfs-packing further split into vfs-pack-db (heavy compute) + vfs-derived (light).

  upload:
    name: Final Upload to R2
    # FIX-4 / D-252 §E: vfs-pack-db ADDED so the published meta-NN.db set can be bound
    # to the CURRENT-CYCLE VFS Pack R2 authority (H17/PR#2265 producer) before Final
    # Upload — the DB the site describes must be the DB it serves. No DAG cycle:
    # vfs-pack-db -> vfs-derived -> upload stays acyclic; the added edge only exposes
    # vfs-pack-db's already-verified outputs (verified_vfs_pack_{staging_prefix,set_sha})
    # to a downstream sink; no duplicate producer, no 1/4-2/4-3/4 semantics change.
    needs: [mesh-baking, master-fusion-persist, vfs-derived, vfs-pack-db, check-upstream]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/factory-setup
        with:
          aggressive-disk-cleanup: 'false'
          with-rust-ffi: 'true'
      - name: R2 Fallback for Rust FFI
        continue-on-error: true
        run: |
          FOUND=$(find rust -name '*.node' 2>/dev/null | wc -l)
          [ "$FOUND" -lt 9 ] && node scripts/factory/r2-workflow-cli.js restore-rust-ffi || true
      - name: Restore Base Output from Cache
        id: cache-output-upload
        uses: actions/cache/restore@v5
        with:
          path: output/
          key: cycle-${{ needs.check-upstream.outputs.upstream-run-id }}-output
          # FIX-2 / C12 (D-264): the GHA cache is EXACT-KEY acceleration ONLY. The
          # `cycle-<upstream-run-id>-` restore-keys PREFIX authority is REMOVED (a prefix
          # hit is identity-ambiguous -- could pull a wrong-shape -shards/-harvest entry --
          # and was consumed UNVERIFIED). The verify-or-recover step below is the
          # correctness truth vs the attempt-scoped R2 authority.
      # FIX-2 / C12 (D-264) CONSUMER: verify-or-recover the EXACT cycle-output set
      # (output/cache/**) against the current-cycle attempt-scoped R2 AUTHORITY established
      # by 3/4 finalize. Cross-workflow cycle key = the 3/4 Aggregate run id = upstream-run-id.
      # The GHA cache (restored above) is USED only if output/cache/** EXACTLY matches the
      # producer manifest (EXACT-set + per-file sha + set_sha == descriptor set_sha); on GHA
      # miss OR mismatch wipe ONLY output/cache/** (NEVER output/data/, owned by FIX-4
      # meta-NN.db) + recover from the EXACT staging + re-verify. A missing authority /
      # invalid descriptor / residual mismatch FAILS CLOSED. The fixed prefix
      # state/cycle-output/ is NO LONGER a recovery input.
      - name: Verify or Recover Cycle Output from R2 Authority (FIX-2 / D-264)
        env:
          HANDOFF_FINALIZE_RUN_ID: ${{ needs.check-upstream.outputs.upstream-run-id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ai-nexus-assets
        run: |
          set -uo pipefail
          mkdir -p output/cache
          PID="${HANDOFF_FINALIZE_RUN_ID}"
          if [ -z "$PID" ]; then echo "::error::FIX-2: no upstream-run-id resolved -- cannot consume cycle-output safely."; exit 1; fi
          # (1) resolve the current-cycle attempt-scoped R2 authority descriptor (fail-closed).
          DESC="state/_handoff/cycle-output/${PID}/handoff.json"
          node scripts/factory/r2-workflow-cli.js restore-file "$DESC" /tmp/cycle-output-handoff-rb.json --strict || { echo "::error::FIX-2: no current-cycle cycle-output authority descriptor ($DESC). Fail-closed."; exit 1; }
          OUT=$(node scripts/factory/cycle-output-handoff-manifest.mjs verify-descriptor /tmp/cycle-output-handoff-rb.json --carrier=cycle-output-authority) || { echo "::error::FIX-2: cycle-output descriptor provenance invalid. Fail-closed."; exit 1; }
          STAGING_PREFIX=$(printf '%s' "$OUT" | cut -f1); EXPECT_SET_SHA=$(printf '%s' "$OUT" | cut -f2)
          node scripts/factory/r2-workflow-cli.js restore-file "${STAGING_PREFIX}manifest.json" /tmp/cycle-output-manifest.json --strict || { echo "::error::FIX-2: cycle-output manifest missing at ${STAGING_PREFIX}. Fail-closed."; exit 1; }
          verify_cycle_output() { node scripts/factory/cycle-output-handoff-manifest.mjs verify output /tmp/cycle-output-manifest.json --carrier=cycle-output-authority; }
          # (2) GHA fast path: verify the GHA-restored output/cache/** against the R2 manifest.
          NEED_RECOVER=0
          if OUT2=$(verify_cycle_output) && [ "$(printf '%s' "$OUT2" | tail -n1)" = "$EXPECT_SET_SHA" ]; then
            echo "[CYCLE-OUTPUT-HANDOFF] GHA fast-path cycle-output matches producer set_sha=$EXPECT_SET_SHA"
          else
            echo "[CYCLE-OUTPUT-HANDOFF] GHA miss/mismatch -- recover from exact staging"; NEED_RECOVER=1
          fi
          # (3) GHA miss/mismatch => wipe ONLY output/cache/** (NEVER output/data/) + recover
          # from the EXACT attempt-scoped staging + re-verify set_sha256.
          if [ "$NEED_RECOVER" = "1" ]; then
            rm -rf output/cache; mkdir -p output/cache
            node scripts/factory/r2-workflow-cli.js restore-dir "${STAGING_PREFIX}cache/" output/cache/ --strict || { echo "::error::FIX-2: recover restore failed (${STAGING_PREFIX}cache/). Fail-closed."; exit 1; }
            rm -f output/manifest.json output/handoff.json output/_manifest.json 2>/dev/null || true
            OUT2=$(verify_cycle_output) || { echo "::error::FIX-2: exact-staging cycle-output recovery failed verification (${STAGING_PREFIX}). Fail-closed."; exit 1; }
            [ "$(printf '%s' "$OUT2" | tail -n1)" = "$EXPECT_SET_SHA" ] || { echo "::error::FIX-2: recovered cycle-output set hash != producer $EXPECT_SET_SHA. Fail-closed."; exit 1; }
            echo "[CYCLE-OUTPUT-HANDOFF] recovered + verified cycle-output from exact staging"
          fi
      - name: Restore Upload Manifest from Cache
        uses: actions/cache/restore@v5
        with:
          path: output/cache/last-upload-manifest.json
